/* ---------- Очистка хранилища: файлы, на которые не ссылается ни один документ ---------- */
const GC={st:null,orph:[],busy:false,done:0,err:0};
async function gcScan(){if(!st.assets||!st.isOwner)return;if(!st.loaded.has('files')||!Object.keys(st.files||{}).length){toast('Документы ещё загружаются, попробуйте через пару секунд');return}
  GC.st='scan';schedule();try{const r=await st.assets.list();const used=new Set(Object.values(st.files||{}).map(x=>x.assetId).filter(Boolean));
    GC.orph=(r.assets||[]).filter(a=>!used.has(a.id));GC.st='ready'}catch(e){GC.st='fail'}schedule()}
async function gcRun(){if(GC.busy||!GC.orph.length)return;const used=new Set(Object.values(st.files||{}).map(x=>x.assetId).filter(Boolean));GC.busy=true;GC.done=0;GC.err=0;schedule();
  for(const a of GC.orph.slice()){if(used.has(a.id))continue;let ok=false;for(let t=0;t<3&&!ok;t++){try{await st.assets.delete(a.id);ok=true}catch(e){if(e&&e.code==='rate_limited'){await new Promise(r=>setTimeout(r,2000*(t+1)))}else break}}
    if(ok)GC.done++;else GC.err++;if((GC.done+GC.err)%10===0)schedule()}
  GC.busy=false;GC.orph=[];GC.st=GC.err?'partial':'clean';schedule();toast(GC.err?`Удалено ${GC.done}, не получилось ${GC.err}`:`Удалено неиспользуемых файлов: ${GC.done}`)}
XACT.gcScan=()=>gcScan();XACT.gcRun=()=>{if(st.gcAsk){st.gcAsk=false;gcRun()}else{st.gcAsk=true;schedule()}};
function gcBar(){if(!st.isOwner||!st.assets)return '';if(!GC.st&&!Object.keys(st.files||{}).length)return '';
  if(GC.busy)return `<div class="banner" style="margin-bottom:12px"><span>Удаляю неиспользуемые файлы: ${GC.done+GC.err} из ${GC.orph.length}…</span></div>`;
  if(GC.st==='ready'){const sz=GC.orph.reduce((s,a)=>s+(a.sizeBytes||0),0);return GC.orph.length?`<div class="banner" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>В хранилище <b>${GC.orph.length}</b> ${plur(GC.orph.length,'файл','файла','файлов').replace(/^\d+\s/,'')} (${fSize(sz)}), на которые не ссылается ни один документ — повторные и старые копии. Из-за них может не проходить проверка при «Поделиться».</span><button class="btn sm ${st.gcAsk?'danger':''}" data-act="gcRun">${st.gcAsk?'Точно удалить '+GC.orph.length+'?':'Удалить неиспользуемые'}</button></div>`:`<div class="note" style="margin-bottom:12px">Лишних файлов в хранилище нет.</div>`}
  if(GC.st==='scan')return `<div class="note" style="margin-bottom:12px">Проверяю хранилище…</div>`;
  if(GC.st==='clean')return `<div class="note" style="margin-bottom:12px">Хранилище очищено: удалено ${GC.done} неиспользуемых файлов.</div>`;
  return `<div style="margin-bottom:12px"><button class="btn sm" data-act="gcScan">Проверить хранилище на лишние файлы</button></div>`}

/* ---------- Убрать PDF-копии из хранилища (для «Поделиться»); документы остаются, открываются в Didox ---------- */
const PG={busy:false,n:0,tot:0,err:0,done:false,stage:''};
async function purgeAll(){if(PG.busy||!st.assets||!st.isOwner)return;if(!st.loaded.has('files')||!st.filesRaw){toast('Документы ещё загружаются');return}
  const retry=async fn=>{for(let t=0;t<5;t++){try{return await fn()}catch(e){if(e&&(e.code==='rate_limited'||e.code==='store_unavailable'))await new Promise(r=>setTimeout(r,1500*(t+1)));else throw e}}throw new Error('retry')};
  PG.busy=true;PG.err=0;PG.n=0;PG.done=false;PG.stage='db';schedule();
  try{for(const [did,d] of Object.entries(st.filesRaw)){if(Array.isArray(d.bundle)){if(d.bundle.some(it=>it.assetId)){const {id:_x,...rest}=d;await retry(()=>st.rawDb.doc('files/'+did).set({...rest,bundle:d.bundle.map(({assetId,...it})=>it)}))}}
      else if(d.assetId&&d.didox)await retry(()=>st.rawDb.doc('files/'+did).update({assetId:null}))}}
  catch(e){PG.busy=false;toast('Не удалось обновить документы — файлы не тронуты');schedule();return}
  PG.stage='del';let all=[];try{const r=await retry(()=>st.assets.list());all=r.assets||[]}catch(e){}
  const keep=new Set(Object.values(st.filesRaw).filter(d=>!Array.isArray(d.bundle)&&d.assetId&&!d.didox&&!d.deleted).map(d=>d.assetId));
  const del=all.filter(a=>!keep.has(a.id));PG.tot=del.length;schedule();
  for(const a of del){try{await retry(()=>st.assets.delete(a.id))}catch(e){PG.err++}PG.n++;if(PG.n%10===0)schedule()}
  PG.busy=false;PG.done=true;schedule();toast(PG.err?`Удалено ${PG.n-PG.err} из ${PG.tot}`:`Удалено файлов: ${PG.tot}`)}
XACT.purge=()=>{if(st.purgeAsk){st.purgeAsk=false;purgeAll()}else{st.purgeAsk=true;schedule()}};
function reupBar(){if(!st.isOwner||!st.assets)return '';
  if(PG.busy)return `<div class="banner" style="margin-bottom:12px"><span>${PG.stage==='db'?'Обновляю документы…':`Удаляю PDF-копии из хранилища: <b>${PG.n} из ${PG.tot}</b>. Не закрывайте страницу.`}</span></div>`;
  if(PG.done)return `<div class="note" style="margin-bottom:12px">Готово${PG.err?` (не удалилось: ${PG.err}, нажмите ещё раз)`:''}: PDF-копий в хранилище больше нет, документы открываются в Didox. Попробуйте «Поделиться» снова.</div>`;
  const hasA=Object.values(st.filesRaw||{}).some(d=>Array.isArray(d.bundle)?d.bundle.some(i=>i.assetId):!!(d.assetId&&d.didox));
  if(!hasA)return '';
  return `<div class="banner" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>«Поделиться» не проходит из-за загруженных PDF-файлов. Можно убрать копии PDF из системы: все документы, компании и договоры останутся, а открываться будут в Didox.</span><button class="btn sm ${st.purgeAsk?'danger':''}" data-act="purge">${st.purgeAsk?'Точно убрать все PDF-копии?':'Убрать PDF-копии'}</button></div>`}

/* =================== Себестоимость услуг и оргструктура =================== */
st.services={};st.staff={};st.citems={};st.ccfg={};st.costScen=st.costScen||'now';st.staffDenied=false;
const som=v=>nf.format(Math.round(+v||0)).replace(/[  ]/g,' ');
const COST_COLS=['services','staff','citems','ccfg'];
(function costSub(){
  if(!st.rawDb)return setTimeout(costSub,300);
  const db=st.rawDb;
  for(const col of ['services','staff','citems'])db.collection(col).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]={...d.data(),id:d.id});st[col]=o;st.loaded.add(col);if(col==='staff')st.staffDenied=false;schedule()},()=>{if(col==='staff')st.staffDenied=true;st.loaded.add(col);schedule()});
  db.doc('ccfg/main').onSnapshot(s=>{st.ccfg=s.exists?s.data():{};st.loaded.add('ccfg');schedule()},()=>{st.loaded.add('ccfg');schedule()});
})();
const socRate=()=>{const r=st.ccfg&&st.ccfg.soc;return r==null||isNaN(+r)?0.12:+r};
const svcList=()=>Object.values(st.services).sort((a,b)=>(a.order??99)-(b.order??99)||String(a.name).localeCompare(String(b.name),'ru'));
const staffCost=s=>(+s.salary||0)*(1+socRate());
const monthEnd=m=>addDays(addMonths(m+'-01',1,1),-1);
const staffOn=(s,scen,m)=>{if(s.status==='left')return !!(s.to&&s.to>=m+'-01'&&s.from&&s.from<=monthEnd(m));if(s.status==='hire')return scen==='hire';return !s.from||s.from<=monthEnd(m)};
const costMonth=()=>TODAY.slice(0,7);

function costCalc(scen,extra,skipId,mm){
  const m=mm||costMonth(),S=svcList(),R={};
  S.forEach(v=>R[v.id]={svc:v,staff:0,items:0,ovh:0,cap:0,heads:[]});
  let ovh=0,ovhStaff=0,ovhItems=0,fotSpec=0,fotAll=0,heads=0;const unalloc=[];
  const list=Object.values(st.staff).filter(s=>s.id!==skipId&&staffOn(s,scen,m));if(extra)list.push(extra);
  for(const s of list){
    const c=staffCost(s);fotAll+=c;heads++;
    if(s.kind==='ovh'){ovh+=c;ovhStaff+=c;continue}
    const al=s.alloc||{};let used=0;
    for(const [sid,p] of Object.entries(al)){const r=R[sid];const f=(+p||0)/100;if(!r||f<=0)continue;used+=f;r.staff+=c*f;fotSpec+=c*f;r.heads.push(s);
      const dur=+r.svc.dur||45;r.cap+=(+s.hours||0)*f*60/dur}
    if(used<0.999){const rest=c*Math.max(0,1-used);ovh+=rest;ovhStaff+=rest;if(rest>0.5)unalloc.push(s)}
  }
  for(const it of Object.values(st.citems)){const a=+it.amount||0;if(it.svc&&R[it.svc])R[it.svc].items+=a;else{ovh+=a;ovhItems+=a}}
  const base=S.reduce((t,v)=>t+R[v.id].staff,0);
  for(const v of S){const r=R[v.id];r.ovh=base>0.5?ovh*r.staff/base:0;
    r.vol=+v.plan>0?+v.plan:Math.floor(r.cap);r.volSrc=+v.plan>0?'plan':'cap';
    r.mat=(+v.mat||0)*r.vol;r.fixed=r.staff+r.items+r.ovh;r.month=r.fixed+r.mat;
    r.unit=r.vol>0?r.month/r.vol:null;r.unitFull=r.cap>=1?r.fixed/Math.floor(r.cap)+(+v.mat||0):null;
    const price=+v.price||0;r.margin=r.unit!=null&&price?price-r.unit:null;r.mpct=r.margin!=null?r.margin/price:null;
    r.be=price>(+v.mat||0)?Math.ceil(r.fixed/(price-(+v.mat||0))):null;r.load=r.cap>=1&&r.vol?r.vol/Math.floor(r.cap):null}
  return{R,S,ovh,ovhStaff,ovhItems,fotSpec,fotAll,heads,base,unalloc,m};
}

function costFact(){
  const E=st._E||[],m=addMonths(mStart(TODAY),-1,1).slice(0,7),rev={},avg={};
  const from=addMonths(mStart(TODAY),-3,1).slice(0,7);let pay=0,tax=0;
  for(const e of E){if(!e.fact)continue;const mm=e.date.slice(0,7);const v=Math.abs(val(e,'UZS'));
    if(mm===m){if(e.sign>0)rev[e.cat.id]=(rev[e.cat.id]||0)+v;if(e.cat.id==='out-pay')pay+=v;if(e.cat.id==='out-tax-payroll')tax+=v}
    if(mm>=from&&mm<=m&&e.sign<0&&e.cat.group==='op'&&!['out-pay','out-tax-payroll','out-refund','out-vat'].includes(e.cat.id))avg[e.cat.id]=(avg[e.cat.id]||0)+v/3}
  return{m,rev,pay,tax,avg};
}

function costTiles(C,C0){
  const d=C0&&st.costScen==='hire'?C.fotAll-C0.fotAll:0;
  return `<div class="kpis">
   <div class="kpi"><h3>ФОТ с налогами в месяц</h3><div class="v">${som(C.fotAll)} сум</div><div class="s">${C.heads} ${C.heads%10===1&&C.heads%100!==11?'сотрудник':'сотрудников'} · соцналог ${String(Math.round(socRate()*1000)/10).replace('.',',')}%${d>0.5?` · <b>+${som(d)}</b> с наймом`:''}</div></div>
   <div class="kpi"><h3>Специалисты на услугах</h3><div class="v">${som(C.fotSpec)} сум</div><div class="s">прямые расходы, ${C.fotAll>0.5?Math.round(C.fotSpec/C.fotAll*100):0}% ФОТ</div></div>
   <div class="kpi"><h3>Накладные в месяц</h3><div class="v">${som(C.ovh)} сум</div><div class="s">админ. персонал ${som(C.ovhStaff)} · прочее ${som(C.ovhItems)}</div></div>
   <div class="kpi ${C.base<0.5&&C.ovh>0.5?'bad':''}"><h3>Накладные на 1 сум ФОТ</h3><div class="v">${C.base>0.5?(C.ovh/C.base).toFixed(2).replace('.',','):'—'}</div><div class="s">${C.base>0.5?'распределяются пропорционально ФОТ специалистов':'нет специалистов с долями по услугам'}</div></div></div>`;
}

function vCost(){
  if(!COST_COLS.every(k=>st.loaded.has(k)))return `<div class="panel empty">Загружаю справочники себестоимости…</div>`;
  const scen=st.costScen,C=costCalc(scen),C0=scen==='hire'?costCalc('now'):null,w=st.canWrite;
  const hires=Object.values(st.staff).filter(s=>s.status==='hire');
  let h=`<div class="pfhead"><div class="seg" role="group" aria-label="Состав штата"><button data-act="cScen" data-id="now" aria-pressed="${scen==='now'}">Текущий штат</button><button data-act="cScen" data-id="hire" aria-pressed="${scen==='hire'}">С плановым наймом${hires.length?' · '+hires.length:''}</button></div>
   <span class="note">Расчёт на ${fM(costMonth()+'-01').toLowerCase()} · в сумах</span>${w?`<span class="acts"><button class="btn" data-act="svcNew">Добавить услугу</button><button class="btn pri" data-act="tab" data-id="org">Оргструктура</button></span>`:''}</div>`;
  if(st.staffDenied)h+=`<div class="banner"><span>Зарплаты сотрудников видят только владелец и редакторы, поэтому себестоимость считается без ФОТ.</span></div>`;
  h+=costTiles(C,C0);
  const S=C.S;
  if(!S.length)return h+`<section class="panel empty">Пока нет ни одной услуги. Добавьте услугу с ценой занятия и длительностью — затем распределите на неё сотрудников в «Оргструктуре».</section>`;
  const dCell=(v,v0)=>{if(!C0||v==null||v0==null)return '';const d=v-v0;return Math.abs(d)<0.5?'':`<div class="mut" style="font-size:12px">${d>0?'+':'−'}${som(Math.abs(d))}</div>`};
  const rows=S.map(v=>{const r=C.R[v.id],r0=C0&&C0.R[v.id];
    const mcls=r.mpct==null?'':r.mpct<0?'neg':r.mpct<0.2?'':'pos';
    return `<tr class="click" data-act="svcEdit" data-id="${esc(v.id)}" tabindex="0"><td class="nm" style="white-space:normal;min-width:180px"><b>${esc(v.name)}</b><div class="mut" style="font-size:12px">${+v.dur||45} мин · ${r.heads.length?esc(r.heads.map(s=>s.name||s.pos).join(', ')):'нет специалистов'}</div></td>
     <td class="n">${+v.price?som(v.price):'—'}</td>
     <td class="n">${r.vol||'—'}<div class="mut" style="font-size:12px">${r.volSrc==='plan'?'план':'по мощности'}${r.cap>=1?' · макс. '+Math.floor(r.cap):''}</div></td>
     <td class="n">${som(r.staff)}${dCell(r.staff,r0&&r0.staff)}</td><td class="n">${som(r.items+r.mat)}</td><td class="n">${som(r.ovh)}${dCell(r.ovh,r0&&r0.ovh)}</td>
     <td class="n"><b>${r.unit!=null?som(r.unit):'—'}</b>${dCell(r.unit,r0&&r0.unit)}${r.unitFull!=null&&r.volSrc==='plan'?`<div class="mut" style="font-size:12px">при полной загрузке ${som(r.unitFull)}</div>`:''}</td>
     <td class="n ${mcls}">${r.margin!=null?som(r.margin)+'<div style="font-size:12px">'+Math.round(r.mpct*100)+'%</div>':'—'}</td>
     <td class="n">${r.be!=null?r.be:'—'}${r.be!=null&&r.vol?`<div class="mut" style="font-size:12px">${r.vol>=r.be?'выполняется':'не хватает '+(r.be-r.vol)}</div>`:''}</td></tr>`}).join('');
  const T=S.reduce((t,v)=>{const r=C.R[v.id];return{staff:t.staff+r.staff,o:t.o+r.items+r.mat,ovh:t.ovh+r.ovh,rev:t.rev+(+v.price||0)*(r.vol||0),cost:t.cost+r.month}},{staff:0,o:0,ovh:0,rev:0,cost:0});
  h+=`<section class="panel"><div class="panel-h"><div><h2>Себестоимость единицы услуги</h2><div class="note">Единица — одно занятие, а для курсов — весь курс. Специалисты — оклад с соцналогом по их долям времени. Накладные (администрация, аренда, офис) делятся пропорционально ФОТ специалистов. ${C0?'Под суммами — изменение из-за планового найма.':''}</div></div></div>
   <div class="tbl-wrap"><table><thead><tr><th>Услуга</th><th class="n">Цена для клиента (по прайсу)</th><th class="n">Продаж в мес.</th><th class="n">Специалисты</th><th class="n">Материалы и прямые</th><th class="n">Накладные</th><th class="n">Себестоимость единицы</th><th class="n">Маржа с единицы</th><th class="n">Безубыточность, продаж в мес.</th></tr></thead>
   <tbody>${rows}<tr class="bal"><td>Итого в месяц</td><td class="n"></td><td class="n">выручка ${som(T.rev)}</td><td class="n">${som(T.staff)}</td><td class="n">${som(T.o)}</td><td class="n">${som(T.ovh)}</td><td class="n">${som(T.cost)}</td><td class="n ${T.rev-T.cost<0?'neg':''}">${som(T.rev-T.cost)}</td><td></td></tr></tbody></table></div>
   ${C.base<0.5&&C.ovh>0.5?`<p class="note" style="margin:10px 0 0;color:var(--warn)">Накладные ${som(C.ovh)} сум не распределены: ни у одного специалиста не указаны доли по услугам.</p>`:''}
   ${C.unalloc.length?`<p class="note" style="margin:10px 0 0">Доли времени меньше 100% у: ${esc(C.unalloc.map(s=>s.name||s.pos).join(', '))}. Нераспределённая часть их ФОТ ушла в накладные.</p>`:''}</section>`;
  // прочие расходы
  const F=costFact(),its=Object.values(st.citems).sort((a,b)=>(+b.amount||0)-(+a.amount||0));
  const svcName=id=>st.services[id]?.name||'';
  h+=`<div class="grid2"><section class="panel"><div class="panel-h"><div><h2>Прочие расходы в месяц</h2><div class="note">Аренда, коммунальные, маркетинг, материалы под услугу. Без зарплат — они считаются по оргструктуре.</div></div>${w?`<button class="btn sm sp" data-act="ciNew">Добавить</button>`:''}</div>
   ${its.length?`<div class="tbl-wrap"><table><thead><tr><th>Расход</th><th>Относится к</th><th class="n">В месяц, сум</th></tr></thead><tbody>${its.map(it=>`<tr class="click" data-act="ciEdit" data-id="${esc(it.id)}" tabindex="0"><td style="white-space:normal">${esc(it.name)}</td><td>${it.svc&&st.services[it.svc]?esc(svcName(it.svc)):'<span class="mut">накладные</span>'}</td><td class="n">${som(it.amount)}</td></tr>`).join('')}<tr class="tot"><td>Итого</td><td></td><td class="n">${som(its.reduce((a,x)=>a+(+x.amount||0),0))}</td></tr></tbody></table></div>`:`<div class="empty" style="padding:18px 8px">Прочих расходов пока нет. Добавьте аренду и другие постоянные расходы или возьмите средние из выписок справа.</div>`}</section>`;
  const used=new Set(its.map(x=>x.cat).filter(Boolean));
  const av=Object.entries(F.avg).filter(([k,v])=>v>0.5&&st.cats[k]).sort((a,b)=>b[1]-a[1]);
  h+=`<section class="panel"><div class="panel-h"><div><h2>Факт по выпискам</h2><div class="note">Средние расходы за 3 полных месяца и выручка за ${fM(F.m+'-01').toLowerCase()}.</div></div></div>
   ${av.length?`<div class="tbl-wrap"><table><thead><tr><th>Статья</th><th class="n">В среднем в месяц</th><th></th></tr></thead><tbody>${av.map(([k,v])=>`<tr><td>${esc(st.cats[k].name)}</td><td class="n">${som(v)}</td><td class="n">${used.has(k)?'<span class="mut">в расчёте</span>':w?`<button class="btn sm" data-act="ciFromFact" data-id="${esc(k)}" data-v="${Math.round(v)}">В расчёт</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<p class="note" style="margin:0 0 12px">Расходов по выпискам за последние 3 месяца пока нет.</p>`}
   <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Услуга</th><th class="n">Выручка</th><th class="n">≈ занятий</th></tr></thead><tbody>${(()=>{const X=svcRevMonth(F.m);return S.map(v=>{const r=X.fact?(X.rev[v.id]||0):(F.rev[v.cat]||0);const n=X.fact?(X.cnt[v.id]||0):(+v.price&&r?Math.round(r/v.price):0);return `<tr><td>${esc(v.name)}${X.fact||v.cat?'':' <span class="mut">· статья не указана</span>'}</td><td class="n">${som(r)}</td><td class="n">${n||'—'}</td></tr>`}).join('')})()}
   <tr class="tot"><td>Зарплата и налоги с ФОТ (факт)</td><td class="n">${som(F.pay+F.tax)}</td><td class="n mut">по оргструктуре ${som(C0?C0.fotAll:C.fotAll)}</td></tr></tbody></table></div></section></div>`;
  h+=`<section class="panel"><div class="panel-h"><div><h2>Параметры расчёта</h2></div></div><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
   <div class="fld"><label for="cc-soc">Соцналог работодателя, %</label><input id="cc-soc" type="text" inputmode="decimal" min="0" max="100" step="0.1" value="${Math.round(socRate()*1000)/10}" ${w?'':'disabled'} style="width:140px"></div>
   ${w?`<button class="btn" data-act="ccSave">Сохранить</button>`:''}<span class="note" style="flex:1 1 260px">Стоимость сотрудника для компании = оклад (начислено, до НДФЛ) × (1 + соцналог). НДФЛ удерживается из оклада и в себестоимость отдельно не добавляется.</span></div></section>`;
  return h;
}

/* ---------- Оргструктура ---------- */
function vOrg(){
  if(!COST_COLS.every(k=>st.loaded.has(k)))return `<div class="panel empty">Загружаю оргструктуру…</div>`;
  if(st.staffDenied)return `<section class="panel empty">Оргструктуру с окладами видят только владелец и редакторы.</section>`;
  const w=st.canWrite,all=Object.values(st.staff).filter(s=>s.status!=='left'||(s.to&&s.to>=TODAY));
  const C=costCalc('now'),Ch=costCalc('hire');
  const work=all.filter(s=>s.status!=='hire'),hire=all.filter(s=>s.status==='hire');
  let h=`<div class="pfhead"><span class="note">Карточка сотрудника задаёт, на какие услуги уходит его время. Плановый найм попадает в себестоимость в режиме «С плановым наймом».</span>${w?`<span class="acts"><button class="btn" data-act="stNew" data-id="hire">Плановый найм</button><button class="btn pri" data-act="stNew">Добавить сотрудника</button></span>`:''}</div>
  <div class="kpis"><div class="kpi"><h3>В штате</h3><div class="v">${work.length}</div><div class="s">ФОТ с налогами ${som(C.fotAll)} сум в месяц</div></div>
   <div class="kpi"><h3>Специалисты / администрация</h3><div class="v">${work.filter(s=>s.kind!=='ovh').length} / ${work.filter(s=>s.kind==='ovh').length}</div><div class="s">администрация — в накладных</div></div>
   <div class="kpi"><h3>Плановый найм</h3><div class="v">${hire.length}</div><div class="s">${hire.length?'+'+som(Ch.fotAll-C.fotAll)+' сум в месяц к ФОТ':'нет вакансий'}</div></div></div>`;
  if(!all.length&&!(st.orgView==='list'))return h+`<section class="panel empty">Сотрудников пока нет. Добавьте руководителя, специалистов и администраторов: укажите оклад и на какие услуги уходит время каждого специалиста.</section>`;
  const kids={},ids=new Set(all.map(s=>s.id));all.forEach(s=>{const b=s.boss&&ids.has(s.boss)&&s.boss!==s.id?s.boss:'';(kids[b]??=[]).push(s)});
  const ord=(a,b)=>(a.kind==='ovh'?0:1)-(b.kind==='ovh'?0:1)||String(a.dept||'').localeCompare(String(b.dept||''),'ru')||String(a.pos||'').localeCompare(String(b.pos||''),'ru');
  const card=s=>{const al=Object.entries(s.alloc||{}).filter(([k,p])=>+p>0&&st.services[k]);
    return `<button class="orgc ${s.status==='hire'?'hire':''}" data-act="stEdit" data-id="${esc(s.id)}"><span class="orgh"><b>${esc(s.pos||'Должность не указана')}</b>${s.status==='hire'?`<span class="pill plan">найм${s.from?' с '+fD(s.from):''}</span>`:s.status==='left'?`<span class="pill over">уходит ${fD(s.to)}</span>`:s.kind==='ovh'?'<span class="pill done">накладные</span>':''}</span>
      <span class="orgn">${esc(s.name||(s.status==='hire'?'вакансия':'—'))}${s.dept?' · '+esc(s.dept):''}</span>
      <span class="orgm">${som(s.salary)} сум · для компании ${som(staffCost(s))}${s.kind!=='ovh'&&+s.hours?' · '+s.hours+' ч/мес с детьми':''}</span>
      ${s.kind!=='ovh'?`<span class="chips">${al.length?al.map(([k,p])=>`<span class="tag" style="margin:0">${esc(st.services[k].name)} ${+p}%</span>`).join(''):'<span class="tag" style="margin:0;background:var(--warn-soft);color:var(--warn)">доли по услугам не указаны</span>'}</span>`:''}</button>`};
  const tree=(b,depth)=>{const L=(kids[b]||[]).sort(ord);if(!L.length||depth>12)return '';return `<ul class="org">${L.map(s=>`<li>${card(s)}${tree(s.id,depth+1)}</li>`).join('')}</ul>`};
  const ov=st.orgView||'tree';
  h+=`<div class="seg" role="group" aria-label="Вид"><button data-act="orgV" data-id="tree" aria-pressed="${ov==='tree'}">Структура</button><button data-act="orgV" data-id="list" aria-pressed="${ov==='list'}">Персонал · ${work.length}</button><button data-act="orgV" data-id="vac" aria-pressed="${ov==='vac'}">Вакансии · ${hire.filter(s=>(s.vstate||'open')!=='closed').length}</button><button data-act="orgV" data-id="fot" aria-pressed="${ov==='fot'}">ФОТ ✓</button></div>`;
  if(ov==='list')h+=orgList(work,C);else if(ov==='vac')h+=orgVac(hire,C);else if(ov==='fot')h+=orgFot(all);
  else h+=`<section class="panel"><div class="panel-h"><h2>Структура</h2><span class="note sp">по подчинённости · пунктир — плановый найм</span></div><div class="orgwrap">${tree('',0)}</div></section>`;
  return h;
}

const pctS=v=>(v<0?'−':'')+Math.abs(Math.round(v*100))+'%';
function svcRevMonth(m){const S=svcList(),cnt={},list={};let L=0,any=false;
  for(const v of S){const n=+((v.fact||{})[m])||0;if((v.fact||{})[m]!=null)any=true;cnt[v.id]=n;list[v.id]=n*(+v.price||0);L+=list[v.id]}
  if(!any)return{fact:false,cnt:{},rev:{},k:null};
  let act=0;for(const e of (st._E||[]))if(e.fact&&e.sign>0&&e.date.slice(0,7)===m&&e.cat&&e.cat.group==='op'&&!['in-other','in-payret'].includes(e.cat.id))act+=Math.abs(val(e,'UZS'));
  const k=L>0.5&&act>0.5?act/L:null,rev={};for(const v of S)rev[v.id]=list[v.id]*(k??1);return{fact:true,cnt,rev,k,act,list:L}}
XACT.prM=b=>{st.prM=b.dataset.id;schedule()};
function vProfit(){
  if(!COST_COLS.every(k=>st.loaded.has(k)))return `<div class="panel empty">Загружаю данные…</div>`;
  const cur=costMonth(),months=Array.from({length:6},(_,i)=>addMonths(mStart(TODAY),i-5,1).slice(0,7)).filter(m=>m>='2026-01');
  const sel=months.includes(st.prM)?st.prM:cur,isCur=sel===cur,scen=st.costScen||'now';
  const C=costCalc(isCur?scen:'now',null,null,sel),S=C.S;
  let h=`<div class="pfhead"><div class="seg" role="group" aria-label="Месяц">${months.map(m=>`<button data-act="prM" data-id="${m}" aria-pressed="${sel===m}">${MONS[+m.slice(5)-1]}${m===cur?' · план':''}</button>`).join('')}</div>
   ${isCur?`<div class="seg" role="group" aria-label="Штат"><button data-act="cScen" data-id="now" aria-pressed="${scen==='now'}">Текущий штат</button><button data-act="cScen" data-id="hire" aria-pressed="${scen==='hire'}">С наймом</button></div>`:''}</div>`;
  if(!S.length)return h+`<section class="panel empty">Добавьте услуги во вкладке «Себестоимость услуг».</section>`;
  // факт выручки за месяц
  const SR=svcRevMonth(sel);const rev={};for(const e of (st._E||[])){if(e.fact&&e.sign>0&&e.date.slice(0,7)===sel)rev[e.cat.id]=(rev[e.cat.id]||0)+Math.abs(val(e,'UZS'))}
  const svcCats=new Set(S.map(v=>v.cat).filter(Boolean).concat(SR.fact?['in-svc','in-diag','in-course','in-tomatis','in-consult']:[]));
  const otherRev=Object.entries(rev).filter(([k])=>!svcCats.has(k)&&st.cats[k]&&st.cats[k].group==='op'&&k!=='in-payret').reduce((a,[,v])=>a+v,0);
  const rows=S.map(v=>{const r=C.R[v.id],price=+v.price||0;
    let vol,R0,src;
    if(isCur){vol=r.vol;R0=price*vol;src=r.volSrc==='plan'?'план':'по мощности'}else if(SR.fact){vol=SR.cnt[v.id]||0;R0=SR.rev[v.id]||0;src='по журналу занятий'}else{R0=v.cat?(rev[v.cat]||0):0;vol=price?Math.round(R0/price):0;src='по выручке'}
    const cost=r.fixed+(+v.mat||0)*vol,P=R0-cost;
    return{v,r,vol,rev:R0,cost,P,pct:R0>0.5?P/R0:null,unit:vol?cost/vol:null,src,price}});
  const T=rows.reduce((t,x)=>({rev:t.rev+x.rev,cost:t.cost+x.cost,P:t.P+x.P}),{rev:0,cost:0,P:0});
  const loss=rows.filter(x=>x.P<-0.5),gain=rows.filter(x=>x.P>0.5);
  h+=`<div class="kpis"><div class="kpi"><h3>Выручка ${isCur?'по плану':'факт'}</h3><div class="v">${som(T.rev)} сум</div><div class="s">${fM(sel+'-01')}${!isCur&&otherRev>0.5?' · ещё '+som(otherRev)+' не привязано к услугам':''}</div></div>
   <div class="kpi"><h3>Полная себестоимость</h3><div class="v">${som(T.cost)} сум</div><div class="s">специалисты, накладные, материалы</div></div>
   <div class="kpi ${T.P<-0.5?'bad':''}"><h3>${T.P<-0.5?'Убыток':'Прибыль'} по услугам</h3><div class="v ${T.P<-0.5?'neg':'pos'}">${T.P<0?'−':''}${som(Math.abs(T.P))} сум</div><div class="s">рентабельность ${T.rev>0.5?pctS(T.P/T.rev):'—'}</div></div>
   <div class="kpi ${loss.length?'bad':''}"><h3>Прибыльных / убыточных</h3><div class="v">${gain.length} / ${loss.length}</div><div class="s">${loss.length?'убыточные: '+esc(loss.map(x=>x.v.name).join(', ')):'убыточных услуг нет'}</div></div></div>`;
  const mx=Math.max(1,...rows.map(x=>Math.abs(x.P)));

   ${rows.map(x=>{const mat=(+x.v.mat||0)*x.vol+x.r.items;const be=x.r.be;let fix='';

     return `<tr class="click" data-act="svcEdit" data-id="${esc(x.v.id)}" tabindex="0"><td style="white-space:normal"><b>${esc(x.v.name)}</b><div class="mut" style="font-size:12px">${x.src}${x.price?' · '+som(x.price)+' за '+svcUnit(x.v).acc:''}</div></td><td class="n">${x.vol||0}</td><td class="n">${som(x.rev)}</td><td class="n">${som(x.r.staff)}</td><td class="n">${som(x.r.ovh)}</td><td class="n">${som(mat)}</td><td class="n ${x.P<-0.5?'neg':x.P>0.5?'pos':''}"><b>${x.P<0?'−':''}${som(Math.abs(x.P))}</b></td><td class="n">${x.pct!=null?pctS(x.pct):'—'}</td><td style="white-space:normal;min-width:180px">${fix}</td></tr>`}).join('')}
   <tr class="bal"><td>Итого</td><td></td><td class="n">${som(T.rev)}</td><td class="n">${som(rows.reduce((a,x)=>a+x.r.staff,0))}</td><td class="n">${som(rows.reduce((a,x)=>a+x.r.ovh,0))}</td><td class="n">${som(rows.reduce((a,x)=>a+(+x.v.mat||0)*x.vol+x.r.items,0))}</td><td class="n ${T.P<-0.5?'neg':''}">${T.P<0?'−':''}${som(Math.abs(T.P))}</td><td class="n">${T.rev>0.5?pctS(T.P/T.rev):'—'}</td><td></td></tr></tbody></table></div>
   ${C.base<0.5&&C.ovh>0.5?`<p class="note" style="margin:10px 0 0;color:var(--warn)">Накладные ${som(C.ovh)} сум не распределены: у специалистов не указаны доли по услугам.</p>`:''}</section>`;
  // тренд за полгода (факт)

}


/* =================== Финмодель: цель → продажи → маркетинг → штат → P&L → KPI =================== */
st.plan={};st.comp={};
(function planSub(){
  if(!st.rawDb)return setTimeout(planSub,300);
  st.rawDb.doc('plan/main').onSnapshot(s=>{st.plan=s.exists?s.data():{};st.loaded.add('plan');schedule()},()=>{st.loaded.add('plan');schedule()});
  st.rawDb.collection('comp').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]={...d.data(),id:d.id});st.comp=o;st.loaded.add('comp');schedule()},()=>{st.loaded.add('comp');schedule()});
})();
const PDEF={year:+TODAY.slice(0,4)+1,target:0,margin:30,conv1:30,conv2:50,cpl:50000,load:85,taxMode:'turn',tax:4,vat:0,mktMax:0,fotMax:0,specSalary:8000000,specHours:120};
const PV=k=>{const v=st.plan&&st.plan[k];return v==null||v===''?PDEF[k]:v};
const SVC_DEF={perClient:8,months:3};
const isMkt=it=>it.cat==='out-mkt'||/маркет|реклам|smm|таргет/i.test(it.name||'');
const roleOf=s=>{const p=String(s.pos||'').toLowerCase();if(/руковод|директор|управля|основат/.test(p))return 'head';if(/маркет|smm|реклам|таргет/.test(p))return 'mkt';if(/админ|ресепш|менеджер|координат|продаж/.test(p))return 'admin';if(/бухгал|финанс/.test(p))return 'fin';return s.kind==='ovh'?'other':'spec'};

function market(){const M={};for(const c of Object.values(st.comp))for(const [k,p] of Object.entries(c.prices||{})){const v=+p;if(v>0)(M[k]??=[]).push(v)}
  const R={};for(const [k,L] of Object.entries(M)){L.sort((a,b)=>a-b);R[k]={avg:L.reduce((a,b)=>a+b,0)/L.length,min:L[0],max:L[L.length-1],n:L.length}}return R}

function factRev(){const by={},svcCats=new Set(svcList().map(v=>v.cat).filter(Boolean));
  for(const e of (st._E||[])){if(!e.fact||e.sign<=0||!e.cat||e.cat.group!=='op'||e.cat.id==='in-payret')continue;const m=e.date.slice(0,7);by[m]=(by[m]||0)+Math.abs(val(e,'UZS'))}
  const cur=TODAY.slice(0,7),full=Object.keys(by).filter(m=>m<cur&&by[m]>0.5).sort();const last=full.slice(-3);
  const avg=last.length?last.reduce((a,m)=>a+by[m],0)/last.length:0;const ytd=Object.entries(by).filter(([m])=>m.startsWith(TODAY.slice(0,4))).reduce((a,[,v])=>a+v,0);
  return{by,last,avg,run:avg*12,ytd,months:full.length}}

function modelCalc(over){
  const P=k=>over&&over[k]!=null?over[k]:PV(k);
  const S=svcList(),mk=market(),soc=socRate(),load=Math.max(0.3,Math.min(1,P('load')/100));
  const work=Object.values(st.staff).filter(s=>s.status==='work'||!s.status);
  const mixIn=st.plan.mix||{},pr=st.plan.price||{};
  // цена, по которой считаем
  const price={};S.forEach(v=>{price[v.id]=+pr[v.id]||+v.price||(mk[v.id]?Math.round(mk[v.id].avg):0)});
  // доли выручки
  let mix={};const ms=S.reduce((a,v)=>a+(+mixIn[v.id]||0),0);
  if(ms>0.01)S.forEach(v=>mix[v.id]=(+mixIn[v.id]||0)/ms);
  else{const base=S.map(v=>[v.id,price[v.id]*(+v.plan||0)]),t=base.reduce((a,x)=>a+x[1],0);base.forEach(([k,x])=>mix[k]=t>0?x/t:1/S.length)}
  const Rm=(+P('target')||0)/12;
  // часы и стоимость часа специалистов по услуге
  const avail={},hcost={},pos={};
  for(const s of work){if(s.kind==='ovh')continue;const c=staffCost(s);for(const [k,p] of Object.entries(s.alloc||{})){const f=(+p||0)/100;if(f<=0)continue;const h=(+s.hours||0)*f;(avail[k]??=0);avail[k]+=h;(hcost[k]??={c:0,h:0});hcost[k].c+=c*f;hcost[k].h+=h;(pos[k]??={});pos[k][s.pos||'Специалист']=(pos[k][s.pos||'Специалист']||0)+f}}
  const defH=(+P('specSalary'))*(1+soc)/Math.max(1,+P('specHours'));
  const R={};let T={rev:0,spec:0,mat:0,direct:0,sess:0};
  for(const v of S){const p=price[v.id],rev=Rm*(mix[v.id]||0),sess=p>0?rev/p:0,dur=+v.dur||45,hrs=sess*dur/60;
    const hc=hcost[v.id]&&hcost[v.id].h>0?hcost[v.id].c/hcost[v.id].h:defH;
    const spec=hrs/load*hc,mat=sess*(+v.mat||0),direct=Object.values(st.citems).filter(it=>it.svc===v.id).reduce((a,it)=>a+(+it.amount||0),0);
    const pc=+v.perClient||(v.entry?1:SVC_DEF.perClient),mo=+v.months||(v.entry?1:SVC_DEF.months);
    const active=sess/pc,nw=active/mo;
    const needFte=hrs/(Math.max(1,+P('specHours'))*load),haveFte=(avail[v.id]||0)/Math.max(1,+P('specHours'));
    const mainPos=pos[v.id]?Object.entries(pos[v.id]).sort((a,b)=>b[1]-a[1])[0][0]:'Специалист: '+v.name.toLowerCase();
    const capSess=(avail[v.id]||0)*load*60/dur;
    R[v.id]={v,p,rev,sess,hrs,hc,spec,mat,direct,active,nw,pc,mo,needFte,haveFte,mainPos,capSess,util:avail[v.id]>0?hrs/(avail[v.id]*load):null,mk:mk[v.id]};
    T.rev+=rev;T.spec+=spec;T.mat+=mat;T.direct+=direct;T.sess+=sess}
  // администрация и прочие
  const ovhPos={};for(const s of work.filter(s=>s.kind==='ovh')){const k=s.pos||'Администрация';const o=ovhPos[k]??={pos:k,have:0,cost:0,sal:0,norm:0,staff:[]};o.have++;o.cost+=staffCost(s);o.sal+=+s.salary||0;o.staff.push(s);if(+s.norm>0)o.norm=+s.norm}
  for(const o of Object.values(ovhPos)){o.avg=o.cost/o.have;o.need=o.norm>0?Math.max(1,Math.ceil(T.sess/o.norm)):o.have;o.planCost=o.need*o.avg}
  const ovhStaff=Object.values(ovhPos).reduce((a,o)=>a+o.planCost,0);
  const other=Object.values(st.citems).filter(it=>!it.svc&&!isMkt(it)).reduce((a,it)=>a+(+it.amount||0),0);
  const mktItems=Object.values(st.citems).filter(it=>!it.svc&&isMkt(it)).reduce((a,it)=>a+(+it.amount||0),0);
  // воронка
  const prog=S.filter(v=>!v.entry&&!v.repeat);const paying=(prog.length?prog:S).reduce((a,v)=>a+R[v.id].nw,0);
  const c1=Math.max(0.01,P('conv1')/100),c2=Math.max(0.01,P('conv2')/100);
  const first=paying/c2,leads=first/c1,mkt=Math.max(leads*(+P('cpl')||0),0);
  const entrySess=S.filter(v=>v.entry).reduce((a,v)=>a+R[v.id].sess,0);
  // P&L в месяц
  const vatR=Math.max(0,+P('vat')||0)/100,vat=T.rev*vatR/(1+vatR);
  const varC=T.spec+T.mat+T.direct,gross=T.rev-vat-varC,ebitda=gross-ovhStaff-other-mkt;
  const tax=P('taxMode')==='profit'?Math.max(0,ebitda)*P('tax')/100:(T.rev-vat)*P('tax')/100;const net=ebitda-tax;
  // себестоимость единицы: накладные (админ, прочие, маркетинг) пропорционально ФОТ специалистов
  const pool=ovhStaff+other+mkt;
  for(const v of S){const r=R[v.id];r.ovh=T.spec>0.5?pool*r.spec/T.spec:(S.length?pool/S.length:0);r.full=r.spec+r.mat+r.direct+r.ovh;r.unit=r.sess>0?r.full/r.sess:null;
    r.rec=r.unit!=null?r.unit/(1-Math.min(0.9,P('margin')/100)):null;r.mrg=r.unit!=null&&r.p?(r.p-r.unit)/r.p:null}
  // точка безубыточности по выручке
  const fixed=ovhStaff+other,varRatio=T.rev>0.5?(vat+varC+mkt+(P('taxMode')==='turn'?(T.rev-vat)*P('tax')/100:0))/T.rev:null;
  const be=varRatio!=null&&varRatio<1?fixed/(1-varRatio):null;
  // штат по плану
  const specStaff=work.filter(s=>s.kind!=='ovh').map(s=>{let l=0;for(const [k,p] of Object.entries(s.alloc||{})){const r=R[k];if(r&&r.util!=null)l+=((+p||0)/100)*r.util}return{s,load:l}});
  const hires=S.map(v=>{const r=R[v.id],gap=r.needFte-r.haveFte;return gap>0.25?{v,r,n:Math.ceil(gap-0.25),pos:r.mainPos,sal:hcost[v.id]&&hcost[v.id].h>0?hcost[v.id].c/(1+soc)/(hcost[v.id].h)*(+P('specHours')):+P('specSalary')}:null}).filter(Boolean);
  return{S,R,T,vat,mix,price,ovhPos,ovhStaff,other,mktItems,paying,first,leads,mkt,entrySess,gross,ebitda,tax,net,be,fixed,specStaff,hires,load,P,Rm,c1,c2,mk};
}

const svcUnit=v=>((+v.dur||45)>=300||/курс|сеанс/i.test(v.name||''))?{one:'курс',few:'курса',many:'курсов',acc:'курс'}:{one:'занятие',few:'занятия',many:'занятий',acc:'занятие'};
const pfIn=(k,v,attrs='')=>`<input data-pf="${k}" type="text" inputmode="decimal" value="${v===0||v?(k==='year'?String(v):(([i,f])=>i.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(f!=null?','+f:''))(String(v).split('.'))):''}" ${st.canWrite?'':'disabled'} ${attrs.replace(/\b(min|max|step)="[^"]*"/g,'')}>`;
const mln=v=>{const a=Math.abs(v);return (v<0?'−':'')+(a>=1e9?(a/1e9).toFixed(2).replace('.',',')+' млрд':a>=1e6?(a/1e6).toFixed(1).replace('.',',')+' млн':som(a))};
const pc0=v=>v==null||!isFinite(v)?'—':(v<0?'−':'')+Math.abs(Math.round(v*100))+'%';
XACT.mdlSec=b=>{st.mdlSec=b.dataset.id;schedule()};

function vModel(){
  if(!['services','staff','citems','ccfg','plan','comp'].every(k=>st.loaded.has(k)))return `<div class="panel empty">Загружаю модель…</div>`;
  const M=modelCalc(),w=st.canWrite,F=factRev(),y=PV('year');
  const sec=st.mdlSec||'goal';
  const SEC=[['goal','Цель и оценка'],['price','Себестоимость и рынок'],['sales','Продажи и маркетинг'],['team','Штат по плану'],['pnl','Финпоказатели'],['kpi','KPI сотрудников']];
  let h=`<div class="mdlsteps">${SEC.map(([k,l],i)=>`<button data-act="mdlSec" data-id="${k}" aria-pressed="${sec===k}"><span>${i+1}</span>${l}</button>`).join('')}</div>`;

   <div class="kpi ${M.net<0&&tgt?'bad':''}"><h3>Чистая прибыль</h3><div class="v ${M.net<0?'neg':''}">${tgt?mln(M.net*12):'—'}</div><div class="s">${tgt?'в год · '+pc0(M.T.rev>0?M.net/M.T.rev:null)+' от выручки':''}</div></div>
   <div class="kpi"><h3>Лидов в месяц</h3><div class="v">${tgt?Math.ceil(M.leads):'—'}</div><div class="s">${tgt?'бюджет '+mln(M.mkt)+' в месяц · CAC '+(M.paying?mln(M.mkt/M.paying):'—'):''}</div></div>
   <div class="kpi ${M.hires.length?'':''}"><h3>Штат по плану</h3><div class="v">${tgt?(M.hires.reduce((a,x)=>a+x.n,0)?'+'+M.hires.reduce((a,x)=>a+x.n,0)+' чел.':'хватает'):'—'}</div><div class="s">${tgt?'ФОТ '+mln((M.T.spec+M.ovhStaff)*12)+' в год':''}</div></div></div>`;

  return h;
}

function mdlGoal(M,F){
  const tgt=+PV('target')||0,y=PV('year');
  // мощность текущего штата
  const capRev=M.S.reduce((a,v)=>a+M.R[v.id].capSess*M.R[v.id].p,0)*12;
  let verdict='',vcls='',why=[];
  if(tgt){const g=F.run>0?tgt/F.run:null;
    if(g!=null){why.push(`Сейчас выручка в среднем ${mln(F.avg)} в месяц (${F.last.map(m=>MONS[+m.slice(5)-1]).join(', ')}), это ${mln(F.run)} в год. Цель больше в ${g.toFixed(1).replace('.',',')} раза.`);
      if(g<=1.15){verdict='Реалистично';vcls='fact'}else if(g<=1.6){verdict='Амбициозно, но достижимо';vcls='plan'}else if(g<=2.5){verdict='Очень амбициозно';vcls='over'}else{verdict='Нереалистично без масштабирования';vcls='crit'}
      const need=Math.pow(tgt/12/Math.max(1,F.avg),1/12)-1;if(g>1.15)why.push(`Чтобы выйти на ${mln(tgt/12)} в месяц к концу года, выручка должна расти примерно на ${Math.round(need*100)}% каждый месяц.`)}
    else{why.push('Фактической выручки в выписках пока нет, поэтому цель сравнивается только с мощностью штата.');verdict='Нет истории для сравнения';vcls='done'}
    if(capRev>0){why.push(`Текущие специалисты при загрузке ${PV('load')}% могут дать около ${mln(capRev)} в год по текущим ценам${tgt>capRev?` — для цели не хватает мощности, нужен найм (шаг 4)`:` — мощности хватает`}.`)}
    else why.push('У специалистов не заполнены часы и доли по услугам — мощность штата не посчитать.');
    const fotS=M.T.rev>0.5?(M.T.spec+M.ovhStaff)/M.T.rev:0,mkS=M.T.rev>0.5?M.mkt/M.T.rev:0;
    if(+PV('fotMax')>0)why.push(fotS>PV('fotMax')/100?`ФОТ по плану — ${pc0(fotS)} выручки, это выше вашего предела ${PV('fotMax')}%.`:`ФОТ по плану — ${pc0(fotS)} выручки, в пределах ${PV('fotMax')}%.`);
    if(+PV('mktMax')>0)why.push(mkS>PV('mktMax')/100?`Маркетинг по плану — ${pc0(mkS)} выручки, это выше предела ${PV('mktMax')}%: нужна выше конверсия или дешевле лид.`:`Маркетинг по плану — ${pc0(mkS)} выручки, в пределах ${PV('mktMax')}%.`);
    if(+PV('profitGoal')>0)why.push(`Ваша цель по чистой прибыли — ${mln(+PV('profitGoal'))}; по модели получается ${mln(M.net*12)}.`);
    if(M.net<0)why.push(`При такой выручке модель уходит в убыток ${mln(-M.net*12)} в год: расходы и маркетинг больше маржи. Точка безубыточности — ${M.be?mln(M.be*12)+' в год':'не достигается'}.`);
  }
  return `<section class="panel"><div class="panel-h"><div><h2>Финансовая цель</h2><div class="note">Все поля сохраняются сразу. От них пересчитываются продажи, маркетинг, штат и прибыль.</div></div></div>

    <div class="fld"><label>Конверсия: лид → первичный приём, %</label>${pfIn('conv1',PV('conv1'),'min="1" max="100" step="1"')}</div>

    <div class="fld"><label>Целевая маржинальность, %</label>${pfIn('margin',PV('margin'),'min="0" max="90" step="1"')}</div>
    <div class="fld"><label>Плановая загрузка специалистов, %</label>${pfIn('load',PV('load'),'min="30" max="100" step="5"')}</div>
    <div class="fld"><label>Налог</label><select data-pf="taxMode" ${st.canWrite?'':'disabled'}>${opt('turn','С оборота',PV('taxMode')==='turn')}${opt('profit','На прибыль',PV('taxMode')==='profit')}</select></div>
    <div class="fld"><label>Ставка налога, %</label>${pfIn('tax',PV('tax'),'min="0" max="50" step="0.5"')}</div>
    <div class="fld"><label>НДС в выручке, % (0 — не плательщик)</label>${pfIn('vat',PV('vat'),'min="0" max="20" step="1"')}</div>
    <div class="fld"><label>Предел маркетинга, % выручки</label>${pfIn('mktMax',PV('mktMax')||'','min="0" max="100" step="1" placeholder="не задан"')}</div>
    <div class="fld"><label>Предел ФОТ, % выручки</label>${pfIn('fotMax',PV('fotMax')||'','min="0" max="100" step="1" placeholder="не задан"')}</div>
   </div></section>
   ${tgt?`<section class="panel"><div class="panel-h"><h2>Оценка цели</h2><span class="pill ${vcls}">${verdict}</span></div><ul class="why">${why.map(x=>`<li>${x}</li>`).join('')}</ul></section>`:`<section class="panel empty">Впишите выручку за год — система оценит цифру по фактической выручке из выписок и мощности штата.</section>`}
   <section class="panel"><div class="panel-h"><div><h2>Что учитывается</h2></div></div><div class="note" style="display:grid;gap:6px">
    <div>Расходы плановые — «Прочие расходы в месяц» во вкладке «Себестоимость услуг»; фактические — из выписок. Маркетинг в модели считается от лидов, поэтому расходы с пометкой «маркетинг/реклама» из прочих не суммируются повторно${M.mktItems?` (сейчас там ${mln(M.mktItems)} в месяц)`:''}.</div>
    <div>ФОТ — из оргструктуры. Если для услуги нет специалиста, берётся оклад ${mln(PV('specSalary'))} за ${PV('specHours')} ч в месяц:

    <div>Рынок — цены конкурентов в шаге 2. Конверсия и стоимость лида — из полей выше.</div></div></section>`;
}

    const flag=r.rec!=null&&mk?(r.rec>mk.max?'<span class="pill crit">себестоимость выше рынка</span>':r.rec>mk.avg*1.1?'<span class="pill over">выше среднего</span>':'<span class="pill fact">в рынке</span>'):'';

     <td class="n">${r.unit!=null?som(r.unit):'—'}</td>

     <td class="n"><input data-pf="price.${esc(v.id)}" type="text" inputmode="decimal" min="0" step="1000" value="${ovr||''}" placeholder="${+v.price?som(v.price):mk?som(Math.round(mk.avg)):''}" style="width:130px;text-align:right" ${w?'':'disabled'}></td>
     <td class="n ${r.mrg!=null&&r.mrg<0?'neg':''}">${pc0(r.mrg)}</td><td class="n">${pos!=null?(pos>0?'+':'')+pc0(pos):'—'}</td></tr>`}).join('');

   <div class="tbl-wrap"><table><thead><tr><th>Услуга</th><th class="n">Себестоимость</th><th class="n">Среднее по рынку</th><th class="n">Цена для маржи ${PV('margin')}%</th><th class="n">Цена в модели</th><th class="n">Маржа</th><th class="n">К рынку</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${+PV('target')?'':'<p class="note" style="margin:10px 0 0;color:var(--warn)">Цель выручки не задана, поэтому объём занятий нулевой и себестоимость не считается. Задайте цель в шаге 1.</p>'}
   <p class="note" style="margin:10px 0 0">Пустая «Цена в модели» — берётся цена из карточки услуги, а если её нет — среднее по рынку.</p></section>
   <section class="panel"><div class="panel-h"><div><h2>Конкуренты</h2><div class="note">Цена за одно занятие или приём у каждого конкурента. Среднее по рынку считается по заполненным ценам.</div></div>${w?`<button class="btn sm sp" data-act="compNew">Добавить конкурента</button>`:''}</div>
   ${comps.length?`<div class="tbl-wrap"><table><thead><tr><th>Конкурент</th>${M.S.map(v=>`<th class="n" style="white-space:normal;min-width:110px">${esc(v.name)}</th>`).join('')}</tr></thead><tbody>${comps.map(c=>`<tr class="click" data-act="compEdit" data-id="${esc(c.id)}" tabindex="0"><td style="white-space:normal"><b>${esc(c.name)}</b>${c.note?`<div class="mut" style="font-size:12px">${esc(c.note)}</div>`:''}</td>${M.S.map(v=>`<td class="n">${+(c.prices||{})[v.id]?som(c.prices[v.id]):'<span class="mut">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty" style="padding:18px 8px">Конкурентов пока нет. Добавьте 3–5 центров с их ценами — появится средняя цена по рынку.</div>`}</section>`;
}

    <td class="n"><input data-pf="mix.${esc(v.id)}" type="text" inputmode="decimal" min="0" max="100" step="1" value="${mix[v.id]??''}" placeholder="${Math.round((M.mix[v.id]||0)*100)}" style="width:80px;text-align:right" ${w?'':'disabled'}></td>
    <td class="n">${mln(r.rev*12)}<div class="mut" style="font-size:12px">${mln(r.rev)} в мес.</div></td><td class="n">${som(r.p)}</td><td class="n">${Math.round(r.sess)}</td><td class="n">${Math.round(r.active)}</td><td class="n">${r.nw<1&&r.nw>0?r.nw.toFixed(1).replace('.',','):Math.round(r.nw)}</td></tr>`}).join('');

   <div class="tbl-wrap"><table><thead><tr><th>Услуга</th><th class="n">Доля, %</th><th class="n">Выручка в год</th><th class="n">Цена</th><th class="n">Занятий в мес.</th><th class="n">Активных клиентов</th><th class="n">Новых в мес.</th></tr></thead>
   <tbody>${rows}<tr class="bal"><td>Итого</td><td class="n">${ms?Math.round(ms)+'%':'авто'}</td><td class="n">${mln(M.T.rev*12)}</td><td></td><td class="n">${Math.round(M.T.sess)}</td><td class="n">${Math.round(M.S.reduce((a,v)=>a+M.R[v.id].active,0))}</td><td class="n">${Math.round(M.paying)} платящих</td></tr></tbody></table></div>
   ${ms&&Math.abs(ms-100)>0.5?`<p class="note" style="margin:10px 0 0;color:var(--warn)">Сумма долей ${Math.round(ms)}% — модель нормирует её до 100%.</p>`:''}
   <p class="note" style="margin:10px 0 0">Пустые доли — по текущему плану занятий из карточек услуг. Занятий на клиента, длительность программы и признак «первичный приём» задаются в карточке услуги.</p></section>
   <section class="panel"><div class="panel-h"><div><h2>Лидогенерация и маркетинг</h2><div class="note">От клиентов к лидам по вашей конверсии.</div></div></div>
   <div class="funnel">${[['Лидов',M.leads,'заявки из рекламы, сайта, соцсетей'],['Первичных приёмов',M.first,`конверсия ${PV('conv1')}% от лидов`],['Покупают программу',M.paying,`конверсия ${PV('conv2')}% от приёмов`]].map(([l,v,s],i)=>`<div class="fstep" style="--w:${[100,72,48][i]}%"><b>${tgt?Math.ceil(v):'—'}</b><span>${l} в месяц</span><small>${s}</small></div>`).join('')}</div>
   <div class="kpis" style="margin-top:14px"><div class="kpi"><h3>Бюджет маркетинга</h3><div class="v">${mln(M.mkt)} в мес.</div><div class="s">${mln(M.mkt*12)} в год · ${pc0(M.T.rev?M.mkt/M.T.rev:null)} выручки</div></div>
    <div class="kpi"><h3>Стоимость клиента (CAC)</h3><div class="v">${M.paying?som(M.mkt/M.paying):'—'}</div><div class="s">лид ${som(PV('cpl'))} ÷ общая конверсия ${pc0(M.c1*M.c2)}</div></div>
    <div class="kpi"><h3>Выручка с клиента</h3><div class="v">${M.paying?som(M.T.rev/M.paying):'—'}</div><div class="s">${M.paying&&M.mkt?'окупает маркетинг в '+(M.T.rev/M.mkt).toFixed(1).replace('.',',')+' раза (ROMI)':''}</div></div></div>
   ${M.entrySess>0.5&&Math.abs(M.entrySess-M.first)/Math.max(1,M.first)>0.25?`<p class="note" style="margin:10px 0 0;color:var(--warn)">По доле в выручке первичных приёмов ${Math.round(M.entrySess)} в месяц, а по воронке нужно ${Math.ceil(M.first)}. Подправьте долю первичных услуг или конверсию.</p>`:''}</section>`;
}

function mdlTeam(M){
  const w=st.canWrite,tgt=+PV('target')||0;
  const svcRows=M.S.map(v=>{const r=M.R[v.id],gap=r.needFte-r.haveFte;
    const act=gap>0.25?`<span class="pill crit">+${Math.ceil(gap-0.25)} · ${esc(r.mainPos)}</span>`:gap<-0.75?`<span class="pill over">избыток ${(-gap).toFixed(1).replace('.',',')} ставки</span>`:'<span class="pill fact">хватает</span>';
    return `<tr><td style="white-space:normal"><b>${esc(v.name)}</b></td><td class="n">${Math.round(r.hrs)}</td><td class="n">${r.needFte.toFixed(1).replace('.',',')}</td><td class="n">${r.haveFte.toFixed(1).replace('.',',')}</td><td class="n">${r.util!=null?pc0(r.util):'—'}</td><td>${act}</td></tr>`}).join('');
  const specRows=M.specStaff.sort((a,b)=>a.load-b.load).map(({s,load})=>{const a=load<0.6?'<span class="pill over">недогружен — перераспределить или сократить ставку</span>':load>1.05?'<span class="pill crit">перегружен</span>':'<span class="pill fact">норма</span>';
    return `<tr class="click" data-act="stEdit" data-id="${esc(s.id)}" tabindex="0"><td><b>${esc(s.name||'—')}</b><div class="mut" style="font-size:12px">${esc(s.pos||'')}</div></td><td class="n">${pc0(load)}</td><td>${a}</td></tr>`}).join('');
  const ovh=Object.values(M.ovhPos);
  // ФОТ по позициям в плане
  const P={};for(const {s} of M.specStaff){const k=s.pos||'Специалист';const o=P[k]??={pos:k,n:0,sal:0,cost:0,add:0};o.n++;o.sal+=+s.salary||0;o.cost+=staffCost(s)}
  for(const x of M.hires){const o=P[x.pos]??={pos:x.pos,n:0,sal:0,cost:0,add:0};o.add+=x.n;o.addSal=(o.addSal||0)+x.sal*x.n}
  for(const o of ovh){const p=P[o.pos]??={pos:o.pos,n:0,sal:0,cost:0,add:0};p.n+=o.have;p.sal+=o.sal;p.cost+=o.cost;p.add+=o.need-o.have;p.addSal=(p.addSal||0)+(o.need-o.have)*(o.sal/o.have)}
  const posRows=Object.values(P).map(o=>{const avg=o.n?o.sal/o.n:(o.addSal||0)/Math.max(1,o.add),tot=o.n+o.add,fot=tot*avg*(1+socRate());return{...o,avg,tot,fot}}).sort((a,b)=>b.fot-a.fot);
  const fotNow=Object.values(st.staff).filter(s=>s.status==='work'||!s.status).reduce((a,s)=>a+staffCost(s),0),fotPlan=posRows.reduce((a,o)=>a+o.fot,0);
  return `${tgt?'':'<section class="panel empty">Задайте цель выручки в шаге 1 — тогда модель посчитает, сколько специалистов нужно.</section>'}
   <section class="panel"><div class="panel-h"><div><h2>Мощность по услугам</h2><div class="note">Нужно ставок = часы занятий ÷ (${PV('specHours')} ч × загрузка ${PV('load')}%). Есть — по часам и долям специалистов в оргструктуре.</div></div></div>
   <div class="tbl-wrap"><table><thead><tr><th>Услуга</th><th class="n">Часов в мес.</th><th class="n">Нужно ставок</th><th class="n">Есть ставок</th><th class="n">Загрузка</th><th>Решение</th></tr></thead><tbody>${svcRows}</tbody></table></div>
   ${w&&M.hires.length?`<div class="acts" style="justify-content:flex-start;margin-top:12px">${M.hires.map((x,i)=>`<button class="btn sm pri" data-act="mdlHire" data-id="${i}">Создать вакансию: ${esc(x.pos)}${x.n>1?' ×'+x.n:''}</button>`).join('')}</div>`:''}</section>
   <div class="grid2"><section class="panel"><div class="panel-h"><h2>Загрузка специалистов</h2></div>${specRows?`<div class="tbl-wrap"><table><thead><tr><th>Сотрудник</th><th class="n">Загрузка</th><th>Вывод</th></tr></thead><tbody>${specRows}</tbody></table></div>`:'<div class="empty" style="padding:18px 8px">Специалистов в оргструктуре нет.</div>'}</section>
   <section class="panel"><div class="panel-h"><div><h2>Администрация</h2><div class="note">Норматив (занятий в месяц на одного) задаётся в карточке сотрудника. Без норматива численность не меняется.</div></div></div>${ovh.length?`<div class="tbl-wrap"><table><thead><tr><th>Должность</th><th class="n">Есть</th><th class="n">Нужно</th><th class="n">Норматив</th></tr></thead><tbody>${ovh.map(o=>`<tr><td>${esc(o.pos)}</td><td class="n">${o.have}</td><td class="n ${o.need>o.have?'neg':''}">${o.need}</td><td class="n">${o.norm||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:18px 8px">Административных сотрудников нет.</div>'}</section></div>
   <section class="panel"><div class="panel-h"><div><h2>ФОТ по позициям в плане</h2><div class="note">Оклад — средний по позиции в оргструктуре; для новых позиций — по стоимости часа на услуге. Меняется вместе с целью, ценами, конверсией и загрузкой.</div></div></div>
   <div class="tbl-wrap"><table><thead><tr><th>Позиция</th><th class="n">Сейчас</th><th class="n">Изменение</th><th class="n">По плану</th><th class="n">Оклад</th><th class="n">ФОТ в мес. с налогом</th></tr></thead><tbody>
   ${posRows.map(o=>`<tr><td>${esc(o.pos)}</td><td class="n">${o.n}</td><td class="n ${o.add>0?'neg':o.add<0?'pos':''}">${o.add?(o.add>0?'+':'')+o.add:'—'}</td><td class="n">${o.tot}</td><td class="n">${som(o.avg)}</td><td class="n">${som(o.fot)}</td></tr>`).join('')}
   <tr class="bal"><td>Итого</td><td class="n">${posRows.reduce((a,o)=>a+o.n,0)}</td><td class="n">${posRows.reduce((a,o)=>a+o.add,0)||'—'}</td><td class="n">${posRows.reduce((a,o)=>a+o.tot,0)}</td><td></td><td class="n">${som(fotPlan)}<div class="mut" style="font-size:12px">сейчас ${som(fotNow)}</div></td></tr></tbody></table></div></section>`;
}

function mdlPnl(M){
  const r=M.T.rev,sg=v=>(v<-0.5?'−':'')+som(Math.abs(v)),row=(l,v,cls='',pct=true)=>`<tr class="${cls}"><td>${l}</td><td class="n ${v<-0.5?'neg':''}">${sg(v)}</td><td class="n ${v<-0.5?'neg':''}">${mln(v*12)}</td><td class="n mut">${pct&&r>0.5?pc0(v/r):''}</td></tr>`;
  const head=M.specStaff.length+Object.values(M.ovhPos).reduce((a,o)=>a+o.need,0)+M.hires.reduce((a,x)=>a+x.n,0);
  return `<section class="panel"><div class="panel-h"><div><h2>Финмодель: P&L по плану</h2><div class="note">Выручка из цели, расходы — из оргструктуры по плану, прочих расходов, материалов и маркетинга от лидов.</div></div></div>
   <div class="tbl-wrap"><table><thead><tr><th>Показатель</th><th class="n">В месяц</th><th class="n">В год</th><th class="n">% выручки</th></tr></thead><tbody>
   ${row('Выручка',r,'tot')}${M.vat>0.5?row(`НДС ${PV('vat')}% в выручке`,-M.vat):''}${row('Специалисты (ФОТ с налогом)',-M.T.spec)}${row('Материалы и прямые расходы услуг',-(M.T.mat+M.T.direct))}${row('Валовая прибыль',M.gross,'sub')}
   ${row('Администрация (ФОТ с налогом)',-M.ovhStaff)}${row('Аренда, коммунальные, прочее',-M.other)}${row('Маркетинг',-M.mkt)}${row('EBITDA',M.ebitda,'sub')}
   ${row(PV('taxMode')==='turn'?`Налог с оборота ${PV('tax')}%`:`Налог на прибыль ${PV('tax')}%`,-M.tax)}${row('Чистая прибыль',M.net,'bal')}</tbody></table></div></section>
   <div class="kpis"><div class="kpi"><h3>Точка безубыточности</h3><div class="v">${M.be?mln(M.be)+' в мес.':'—'}</div><div class="s">${M.be?mln(M.be*12)+' в год · запас '+pc0(r>0.5?(r-M.be)/r:null):'переменные расходы больше выручки'}</div></div>
    <div class="kpi"><h3>Постоянные расходы</h3><div class="v">${mln(M.fixed)} в мес.</div><div class="s">администрация и прочие расходы</div></div>
    <div class="kpi"><h3>ФОТ к выручке</h3><div class="v">${pc0(r>0.5?(M.T.spec+M.ovhStaff)/r:null)}</div><div class="s">${mln((M.T.spec+M.ovhStaff)*12)} в год</div></div>
    <div class="kpi"><h3>Выручка на сотрудника</h3><div class="v">${head?mln(r/head):'—'}</div><div class="s">в месяц · ${head} чел. по плану</div></div></div>`;
}

function kpiFor(s,M){const role=roleOf(s),r=M.T.rev,L=[];
  if(role==='spec'){let sess=0,rev=0;for(const [k,p] of Object.entries(s.alloc||{})){const x=M.R[k];if(!x)continue;const n=(+s.hours||0)*((+p||0)/100)*M.load*60/(+x.v.dur||45);const share=x.haveFte>0?((+s.hours||0)*(+p||0)/100/PV('specHours'))/x.haveFte:0;const need=x.sess*share;const t=Math.min(n,need||n);sess+=t;rev+=t*x.p}
    L.push(['Занятий в месяц',Math.round(sess)],['Загрузка часов',`≥ ${PV('load')}%`],['Выручка по направлению',mln(rev)+' в мес.'],['Удержание клиентов до конца программы','≥ 80%']);}
  else if(role==='admin'){L.push(['Первичных приёмов в месяц',Math.ceil(M.first)],['Конверсия приём → программа',`≥ ${PV('conv2')}%`],['Конверсия лид → приём',`≥ ${PV('conv1')}%`],['Заполненность расписания',`≥ ${PV('load')}%`])}
  else if(role==='mkt'){L.push(['Лидов в месяц',Math.ceil(M.leads)],['Стоимость лида',`≤ ${som(PV('cpl'))}`],['Бюджет',`≤ ${mln(M.mkt)} в мес.`],['CAC',M.paying?`≤ ${som(M.mkt/M.paying)}`:'—'])}
  else if(role==='head'){L.push(['Выручка',mln(r)+' в мес.'],['Чистая прибыль',mln(M.net)+' в мес.'],['Рентабельность',pc0(r?M.net/r:null)],['ФОТ к выручке',`≤ ${pc0(r?(M.T.spec+M.ovhStaff)/r:null)}`])}
  else if(role==='fin'){L.push(['Расходы в пределах плана','100%'],['Дебиторка старше 30 дней','0'],['Отчёт по факту','до 5-го числа'])}
  else L.push(['Расходы участка',`в пределах плана`]);
  return{role,L}}
const ROLE_N={spec:'специалист',admin:'администрация',mkt:'маркетинг',head:'руководство',fin:'финансы',other:'прочее'};
function mdlKpi(M){
  const work=Object.values(st.staff).filter(s=>s.status==='work'||!s.status||s.status==='hire');
  if(!work.length)return `<section class="panel empty">В оргструктуре никого нет — KPI появятся, когда добавите сотрудников.</section>`;
  const hasMkt=work.some(s=>roleOf(s)==='mkt');
  return `<section class="panel"><div class="panel-h"><div><h2>KPI сотрудников по плану</h2><div class="note">Считаются из цели, плана продаж и воронки. Роль определяется по должности: руководитель, администратор/менеджер, маркетолог, бухгалтер, остальные — специалисты.</div></div></div>
   <div class="vacs">${work.sort((a,b)=>String(roleOf(a)).localeCompare(roleOf(b))).map(s=>{const k=kpiFor(s,M);return `<article class="vac"><div class="orgh"><b>${esc(s.pos||'—')}</b><span class="pill done">${ROLE_N[k.role]}</span>${s.status==='hire'?'<span class="pill plan">вакансия</span>':''}</div><div class="orgn">${esc(s.name||'')}</div>
    <table class="kpit"><tbody>${k.L.map(([l,v])=>`<tr><td>${l}</td><td class="n"><b>${v}</b></td></tr>`).join('')}</tbody></table></article>`}).join('')}</div>
   ${hasMkt?'':`<p class="note" style="margin:12px 0 0">Маркетолога в штате нет — KPI по лидам (${Math.ceil(M.leads)} в месяц, лид ≤ ${som(PV('cpl'))}) закрепите за руководителем или подрядчиком.</p>`}</section>`;
}

/* ---------- сохранение полей модели ---------- */
document.addEventListener('change',async e=>{const t=e.target;if(!t||!t.dataset||!t.dataset.pf||!st.db)return;
  const k=t.dataset.pf,raw=String(t.value).trim();const clean=raw.replace(/[\s\u00a0\u202f]/g,'').replace(',','.');const v=t.tagName==='SELECT'?raw:(clean===''?null:parseFloat(clean));
  if(t.tagName!=='SELECT'&&clean!==''&&!isFinite(v)){toast('Введите число, например 5 000 000 000');schedule();return}
  if(v!=null&&t.tagName!=='SELECT'){const bad=v<0?'Значение не может быть отрицательным':k==='year'&&(v<2020||v>2100||v%1)?'Год — например, 2027':/^(conv1|conv2|margin|tax|vat|mktMax|fotMax)$|^mix\./.test(k)&&v>100?'Процент — от 0 до 100':k==='load'&&v>150?'Загрузка — не больше 150%':'';if(bad){toast(bad);schedule();return}}
  const P={...(st.plan||{})};if(k.includes('.')){const [a,b]=k.split('.');const o={...(P[a]||{})};if(v==null||v===0&&a==='price')delete o[b];else o[b]=v;P[a]=o}else{if(v==null)delete P[k];else P[k]=v}
  st.plan=P;schedule();try{await st.db.doc('plan/main').set(P)}catch(err){toast(writeErr(err))}});
XACT.mdlHire=async b=>{const M=modelCalc(),x=M.hires[+b.dataset.id];if(!x)return;try{for(let i=0;i<x.n;i++)await st.db.collection('staff').doc().set({pos:x.pos,dept:'Специалисты',salary:Math.round(x.sal/10000)*10000,kind:'spec',hours:+PV('specHours'),alloc:{[x.v.id]:100},status:'hire',from:addMonths(mStart(TODAY),1,1),vstate:'open',prio:'norm',vnote:'Создано из финмодели',at:new Date().toISOString()});toast(`Вакансия создана: ${x.pos}${x.n>1?' ×'+x.n:''}. Она в «Оргструктуре» → «Вакансии».`)}catch(e){toast(writeErr(e))}};

/* ---------- конкуренты ---------- */
XACT.compNew=()=>openDrawer('comp');XACT.compEdit=b=>openDrawer('comp',b.dataset.id);XACT.compDel=xDel('comp','Конкурент удалён');
XDRAW.comp=id=>{const c=id?st.comp[id]:{prices:{}};return{title:id?'Конкурент':'Новый конкурент',fields:`<div class="fld"><label for="cp-n">Название центра</label><input id="cp-n" required value="${esc(c.name||'')}" placeholder="Например, центр развития «…»"></div>
  <div class="fld"><label for="cp-note">Комментарий</label><input id="cp-note" value="${esc(c.note||'')}" placeholder="Район, источник цен, дата"></div>
  <div class="row2">${svcList().map(v=>`<div class="fld"><label for="cp-p-${esc(v.id)}" style="font-weight:400">${esc(v.name)}, сум</label><input id="cp-p-${esc(v.id)}" type="text" inputmode="decimal" min="0" step="1000" value="${(c.prices||{})[v.id]??''}"></div>`).join('')}</div>
  <p class="note" style="margin:0">Цена за одно занятие или приём. Если у конкурента только пакет — разделите на число занятий.</p>${delBtn('compDel',id)}`}};
XSAVE.comp=async(id,v)=>{if(!v('#cp-n'))return ferr('Укажите название.');const prices={};svcList().forEach(s=>{const p=num(v('#cp-p-'+s.id));if(p>0)prices[s.id]=p});const d={name:v('#cp-n'),note:v('#cp-note'),prices};
  if(id)await st.db.collection('comp').doc(id).update(d);else await st.db.collection('comp').doc().set({...d,at:new Date().toISOString()});toast('Конкурент сохранён');closeDrawer()};

/* ---------- ФОТ с галочками (в оргструктуре) ---------- */
st.fotOff=st.fotOff||new Set();st.fotOn=st.fotOn||new Set();
const fotChecked=s=>s.status==='hire'?st.fotOn.has(s.id):!st.fotOff.has(s.id);
XACT.fotTog=b=>{const s=st.staff[b.dataset.id];if(!s)return;const on=fotChecked(s);if(s.status==='hire'){on?st.fotOn.delete(s.id):st.fotOn.add(s.id)}else{on?st.fotOff.add(s.id):st.fotOff.delete(s.id)}schedule()};
XACT.fotAll=b=>{const all=Object.values(st.staff).filter(s=>s.status!=='left');if(b.dataset.id==='now'){st.fotOff.clear();st.fotOn.clear()}else if(b.dataset.id==='all'){st.fotOff.clear();all.filter(s=>s.status==='hire').forEach(s=>st.fotOn.add(s.id))}schedule()};
function orgFot(all){
  if(!all.length)return `<section class="panel empty">Сотрудников пока нет.</section>`;
  const on=all.filter(fotChecked),now=all.filter(s=>s.status!=='hire');
  const f=L=>L.reduce((a,s)=>a+staffCost(s),0),fOn=f(on),fNow=f(now),d=fOn-fNow;
  // эффект на модель: прибыль при выбранном составе
  let eff='';if(+PV('target')>0&&st.loaded.has('plan')){const M=modelCalc();const planFot=M.T.spec+M.ovhStaff;const net=M.net+planFot-fOn-(PV('taxMode')==='profit'?(planFot-fOn)*PV('tax')/100*(M.ebitda>0?1:0):0);
    eff=`<div class="kpi ${net<0?'bad':''}"><h3>Прибыль по плану при этом составе</h3><div class="v ${net<0?'neg':''}">${mln(net*12)} в год</div><div class="s">ФОТ ${pc0(M.T.rev>0?fOn/M.T.rev:null)} от плановой выручки · по модели нужно ${mln(planFot)} в мес.</div></div>`}
  const by={};all.forEach(s=>(by[s.dept||'Без отдела']??=[]).push(s));
  const rows=Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0],'ru')).map(([dp,L])=>`<tr class="sub"><td colspan="3">${esc(dp)}</td><td class="n">${som(f(L.filter(fotChecked)))}</td></tr>`+L.sort((a,b)=>(a.status==='hire')-(b.status==='hire')||String(a.pos).localeCompare(String(b.pos),'ru')).map(s=>{const c=fotChecked(s);return `<tr class="${c?'':'off'}"><td style="width:36px"><input type="checkbox" data-act="fotTog" data-id="${esc(s.id)}" ${c?'checked':''} aria-label="Учитывать ${esc(s.pos||'')}"></td><td style="white-space:normal"><b>${esc(s.pos||'—')}</b> ${s.status==='hire'?'<span class="pill plan">вакансия</span>':''}<div class="mut" style="font-size:12px">${esc(s.name||'')}</div></td><td class="n">${som(s.salary)}</td><td class="n">${som(staffCost(s))}</td></tr>`}).join('')).join('');
  return `<div class="kpis"><div class="kpi"><h3>ФОТ выбранного состава</h3><div class="v">${som(fOn)} сум</div><div class="s">в месяц с соцналогом · ${mln(fOn*12)} в год · ${on.length} чел.</div></div>
   <div class="kpi"><h3>К текущему штату</h3><div class="v ${d>0.5?'neg':d<-0.5?'pos':''}">${d>0.5?'+':d<-0.5?'−':''}${som(Math.abs(d))}</div><div class="s">сейчас ${som(fNow)} в месяц</div></div>${eff}</div>
   <section class="panel"><div class="panel-h"><div><h2>Состав для расчёта ФОТ</h2><div class="note">Снимите галочку — увидите ФОТ без этой позиции; отметьте вакансию — с ней. Это черновик для расчёта, оргструктура не меняется.</div></div><span class="acts sp"><button class="btn sm" data-act="fotAll" data-id="now">Текущий штат</button><button class="btn sm" data-act="fotAll" data-id="all">Штат + все вакансии</button></span></div>
   <div class="tbl-wrap"><table class="fott"><thead><tr><th></th><th>Позиция</th><th class="n">Оклад</th><th class="n">Для компании</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

<script>

const sb=()=>NKB.sb;
const H=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nfm=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});

const ago=t=>{if(!t)return 'не заходил';const n=Math.round((Date.now()-new Date(t))/6e4);return n<2?'только что':n<60?n+' мин назад':n<24*60?Math.round(n/60)+' ч назад':dt(t)};
const fsize=b=>!b&&b!==0?'—':b<1024?b+' Б':b<1048576?(b/1024).toFixed(0)+' КБ':(b/1048576).toFixed(1).replace('.',',')+' МБ';
const tabNm=k=>(Object.fromEntries(TABS)[k])||k;
const SHORT={finance:'Финансы',plan:'Планы',cost:'Себестоимость',staff:'Штат и оклады',payroll:'Зарплаты',files:'Файлы'};
const secNm=id=>(((NKB.me&&NKB.me.sections)||[]).find(s=>s.id===id)||{}).name||id||'';

Object.assign(ICO,{files:'<path d="M3.5 6.5a2 2 0 0 1 2-2h3l2 2h5a2 2 0 0 1 2 2v6.5a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2z"/><path d="M10.5 9.5v5M8.3 11.7l2.2-2.2 2.2 2.2"/>',
  access:'<circle cx="8" cy="7" r="3"/><path d="M2.5 17c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/><rect x="13.5" y="9.5" width="5" height="4" rx="1"/><path d="M14.5 9.5V8a1.5 1.5 0 0 1 3 0v1.5"/>',

/* ---------- маршрутизация новых разделов ---------- */

/* ---------- движение пользователей: разделы, карточки, поиск ---------- */

    sb().rpc('touch_seen',{p_tab:st.tab}).then(()=>{},()=>{});track();if(st.tab==='access'||st.tab==='audit')loadUsers();if(st.tab==='audit')loadLog(true);if(st.tab==='files')loadFiles()}},700);

  presence=sb().channel('nk-online',{config:{presence:{key:NKB.me.id}}});
  presence.on('presence',{event:'sync'},()=>{NKS.online=presence.presenceState()||{};if(st.tab==='audit'||st.tab==='access')schedule()}).subscribe(s=>{if(s==='SUBSCRIBED')track()});
  if(NKB.me.is_admin){sb().channel('nk-admin').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>{if(NKS.users)loadUsers()})
    .on('postgres_changes',{event:'*',schema:'public',table:'user_access'},()=>{if(NKS.users)loadUsers()})

    .on('postgres_changes',{event:'*',schema:'public',table:'files'},()=>{if(NKS.files)loadFiles()}).subscribe()}

  if(u.error){say(errText(u.error));return}NKS.users=u.data||[];NKS.ua=a.data||[];NKS.roles=r.data||[];schedule()}

  const rows=U.filter(u=>!isPending(u)).sort((a,b)=>(isOn(b)-isOn(a))||String(a.full_name||a.email).localeCompare(String(b.full_name||b.email),'ru')).map(u=>{

        <option value="" ${e.ov?'':'selected'}>${rl.is_admin?'правка':'по роли: '+LVLS[def]}</option>${rl.is_admin?'':['none','read','write'].map(l=>`<option value="${l}" ${e.ov===l?'selected':''}>${LVLS[l]}</option>`).join('')}</select></td>`}).join('');
    const st_=isOn(u)?'<span class="pill fact">открыт</span>':u.is_active?'<span class="pill over">срок истёк</span>':'<span class="pill crit">закрыт</span>';
    return `<tr class="${isOn(u)?'':'nk-off'}"><td style="min-width:210px;white-space:normal"><div class="nk-u">${onl.has(u.id)?'<i class="dot good" title="сейчас в системе"></i>':''}<input class="nk-in" value="${H(u.full_name||'')}" placeholder="Имя" data-nkch="uname" data-id="${u.id}" ${lock&&!self?'disabled':''}></div>
       <div class="mut" style="font-size:12px">логин: <b>${H(NKB.loginOf(u.email))}</b>${self?' · это вы':''}</div><input class="nk-in sm" value="${H(u.position||'')}" placeholder="должность" data-nkch="upos" data-id="${u.id}" ${lock&&!self?'disabled':''}></td>
      <td><select data-nkch="role" data-id="${u.id}" ${dis}>${roleOpts(u.role)}</select></td>

      ${cells}
      <td class="mut" style="font-size:12px;white-space:normal">${onl.has(u.id)?'<b style="color:var(--in)">в системе</b>':ago(u.last_seen_at)}${u.last_tab?'<br>'+H(tabNm(u.last_tab)):''}</td>

      (NKS.pwFor===u.id?`<tr class="nk-det"><td colspan="${6+secs.length}"><div class="nk-pwrow"><b>Новый пароль для ${H(u.full_name||NKB.loginOf(u.email))}</b><input class="nk-in nk-pwi" id="nk-pw-${u.id}" value="${H(NKS.pwDraft||'')}" autocomplete="off" spellcheck="false"><button class="btn sm" data-nkact="pwgen" data-id="${u.id}">Придумать</button><button class="btn sm pri" data-nkact="pwsave" data-id="${u.id}">Сохранить</button><button class="btn sm" data-nkact="pwopen" data-id="${u.id}">Отмена</button></div></td></tr>`:'')}).join('');
  const matrix=`<div class="tbl-wrap"><table><thead><tr><th>Роль<i class="xbtn" hidden></i></th>${secs.map(s=>`<th>${H(SHORT[s.id]||s.name)}</th>`).join('')}<th>Пользователи и журнал</th></tr></thead><tbody>
    ${(NKS.roles||[]).map(r=>`<tr><td><b style="font-weight:600">${H(r.name)}</b><div class="mut" style="font-size:12px;white-space:normal;max-width:260px">${H(r.description||'')}</div></td>${secs.map(s=>{const l=r.is_admin?'write':(r.defaults||{})[s.id]||'none';return `<td><span class="nk-lvp lv-${l}">${LVLS[l]}</span></td>`}).join('')}<td>${r.is_admin?'<span class="nk-lvp lv-write">да</span>':'<span class="nk-lvp lv-none">нет</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  const act=U.filter(isOn).length;
  const roleSel=`<select id="nk-nu-role">${(NKS.roles||[]).filter(r=>r.id!=='owner'||NKB.me.is_owner).map(r=>`<option value="${r.id}" ${r.id==='viewer'?'selected':''}>${H(r.name)}</option>`).join('')}</select>`;
  const cred=NKS.cred?`<section class="panel nk-cred"><div class="panel-h"><div><h2>${NKS.cred.reset?'Новый пароль задан':'Сотрудник добавлен'}</h2><div class="note">отправьте эти данные сотруднику — пароль больше нигде не показывается</div></div><div class="sp"></div><button class="btn sm" data-nkact="credclose">Закрыть</button></div>
     <pre class="nk-credtx" id="nk-credtx">${H(credText(NKS.cred))}</pre><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm pri" data-nkact="credcopy">Скопировать для отправки</button></div></section>`:'';
  const add=NKS.addOpen?`<section class="panel"><div class="panel-h"><div><h2>Новый сотрудник</h2><div class="note">логин — латиницей без пробелов, например zarina или z.kadirova; можно указать и настоящую почту</div></div></div>
     <div class="nk-form"><label>Имя и фамилия<input id="nk-nu-name" autocomplete="off"></label><label>Должность<input id="nk-nu-pos" autocomplete="off"></label>
      <label>Логин<input id="nk-nu-login" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="zarina"></label>
      <label>Пароль<span class="nk-pwbox"><input id="nk-nu-pw" autocomplete="off" spellcheck="false" value="${H(NKS.nuPw||'')}"><button class="btn sm" data-nkact="nugen">Придумать</button></span></label>
      <label>Роль${roleSel}</label><label>Доступ до <span class="mut">(необязательно)</span><input type="date" id="nk-nu-until"></label></div>
     <div class="nk-msg bad" id="nk-nu-err"></div>
     <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" data-nkact="nusave">Создать и открыть доступ</button><button class="btn" data-nkact="nuopen">Отмена</button></div></section>`:'';
  return `${cred}${add}${pendHtml}<section class="panel"><div class="panel-h"><div><h2>Пользователи · ${U.length}</h2><div class="note">доступ открыт у ${act} · права по разделам задаются ролью, любую ячейку можно поменять вручную</div></div><div class="sp"></div>${NKS.addOpen?'':'<button class="btn sm pri" data-nkact="nuopen">+ Добавить сотрудника</button>'}</div>
    <div class="tbl-wrap"><table class="nk-ut"><thead><tr><th>Сотрудник</th><th>Роль</th><th>Доступ</th><th>Доступ до</th>${secs.map(s=>`<th title="${H(s.name)}">${H(SHORT[s.id]||s.name)}</th>`).join('')}<th>Последний вход</th><th><i class="xbtn" hidden></i></th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="mut">Пока никого</td></tr>'}</tbody></table></div>

   <section class="panel"><div class="panel-h"><div><h2>Роли и права по умолчанию</h2><div class="note">просмотр — видит данные; правка — может добавлять, менять и удалять</div></div></div>${matrix}</section>`}

async function upd(id,patch,ok){const {error}=await sb().from('profiles').update(patch).eq('id',id);if(error)throw error;if(ok)say(ok);await loadUsers()}
ACT.approve=b=>{const id=b.dataset.id,role=(document.getElementById('nk-pr-'+id)||{}).value||'viewer';return upd(id,{role,is_active:true},'Доступ открыт')};

ACT.toggle=b=>{const u=NKS.users.find(x=>x.id===b.dataset.id);if(!u)return;if(u.is_active&&!twice('tg'+u.id,b,'Точно закрыть?'))return;return upd(u.id,{is_active:!u.is_active,note:null},u.is_active?'Доступ закрыт':'Доступ открыт')};
ACT.role=el=>upd(el.dataset.id,{role:el.value},'Роль изменена');
ACT.until=el=>upd(el.dataset.id,{access_until:el.value||null},el.value?'Доступ до '+new Date(el.value).toLocaleDateString('ru-RU'):'Доступ бессрочный');
ACT.uname=async el=>{const id=el.dataset.id;if(id===NKB.me.id){const {error}=await sb().rpc('set_my_name',{p_full_name:el.value,p_position:null});if(error)throw error;NKB.me.full_name=el.value;say('Имя сохранено');return loadUsers()}return upd(id,{full_name:el.value.trim()||null},'Имя сохранено')};

ACT.lvl=async el=>{const {id,sec}=el.dataset;const v=el.value;let r;

  else r=await sb().from('user_access').upsert({user_id:id,section:sec,level:v},{onConflict:'user_id,section'});
  if(r.error)throw r.error;say(v?`«${secNm(sec)}»: ${LVL[v]}`:`«${secNm(sec)}»: как в роли`);await loadUsers()};
const genPw=()=>{const a='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(10));let p='';for(const x of r)p+=a[x%a.length];return /\d/.test(p)?p:p.slice(0,9)+'7'};
const credText=c=>`NEURO KIDS — доступ к финансовой системе\nСсылка: ${location.href.split('#')[0]}\nЛогин: ${c.login}\nПароль: ${c.pw}\n\nПосле входа смените пароль: внизу меню слева → «Сменить пароль».`;
const sqlErr=e=>String(e&&e.message||e||'').replace(/^.*ERROR:\s*/,'');
ACT.nuopen=()=>{NKS.addOpen=!NKS.addOpen;NKS.nuPw=NKS.addOpen?genPw():'';schedule()};

ACT.nusave=async b=>{const v=id=>(document.getElementById(id)||{}).value||'';const err=t=>{const e=document.getElementById('nk-nu-err');if(e)e.textContent=t};
  const login=v('nk-nu-login').trim().toLowerCase(),pw=v('nk-nu-pw'),name=v('nk-nu-name').trim();
  if(!name)return err('Впишите имя сотрудника');if(!/^[a-z0-9._@+\-]{2,}$/.test(login))return err('Логин — латинские буквы, цифры, точка, дефис; без пробелов');if(pw.length<8)return err('Пароль — не короче 8 символов');
  b.disabled=true;const {error}=await sb().rpc('admin_create_user',{p_login:login,p_password:pw,p_full_name:name,p_position:v('nk-nu-pos').trim()||null,p_role:v('nk-nu-role')||'viewer',p_until:v('nk-nu-until')||null});b.disabled=false;
  if(error)return err(sqlErr(error));NKS.cred={login,pw,name};NKS.addOpen=false;NKS.nuPw='';say('Сотрудник добавлен, доступ открыт');await loadUsers();window.scrollTo({top:0})};

  const u=NKS.users.find(x=>x.id===id);b.disabled=true;const {error}=await sb().rpc('admin_set_password',{p_user:id,p_password:pw});b.disabled=false;if(error)return say(sqlErr(error));

  const f=document.getElementById('nk-mpw');setTimeout(()=>f.a.focus(),30);const msg=(t,bad)=>{const e=f.querySelector('.nk-msg');e.textContent=t;e.className='nk-msg'+(bad?' bad':'')};
