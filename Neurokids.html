    <div class="nk-filt"><button class="btn sm ${!NKS.fFolder?'pri':''}" data-nkact="ffold" data-id="">Все</button>${folders.map(f=>`<button class="btn sm ${NKS.fFolder===f?'pri':''}" data-nkact="ffold" data-id="${H(f)}">${H(f)}</button>`).join('')}
     <input type="search" placeholder="Поиск по названию" value="${H(NKS.fq)}" data-nkin="fq"></div>
    ${L.length?`<div class="tbl-wrap"><table><thead><tr><th>Файл<i class="xbtn" hidden></i></th><th>Папка</th><th class="n">Размер</th><th>Загрузил</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">${NKS.trash?'Корзина пуста':'Файлов пока нет'}</div>`}</section>
   <section class="panel"><div class="panel-h"><div><h2>Экспорт данных</h2><div class="note">выгрузка всего, к чему у вас есть доступ</div></div></div>
    <div class="nk-exp"><div><b>Резервная копия (JSON)</b><p class="mut">Все данные системы одним файлом. Из него можно восстановить систему или перенести в другую базу.</p><button class="btn sm" data-nkact="expjson">Скачать копию</button></div>
     <div><b>Таблицы Excel</b><p class="mut">Операции по выпискам, сотрудники, услуги, статьи — каждая на своём листе.</p><button class="btn sm" data-nkact="expxls">Скачать Excel</button></div></div></section>
   ${A?`<section class="panel"><div class="panel-h"><div><h2>Импорт данных</h2><div class="note">загрузка резервной копии JSON · существующие записи обновятся, новые добавятся, ничего не удаляется</div></div></div>
    ${imp?`<div class="tbl-wrap"><table><thead><tr><th>Раздел данных<i class="xbtn" hidden></i></th><th class="n">Новых</th><th class="n">Изменится</th><th class="n">Без изменений</th></tr></thead><tbody>${Object.entries(imp.stat).map(([c,s])=>`<tr><td>${H(COLN[c]||c)} <span class="mut">${H(c)}</span></td><td class="n">${s.add}</td><td class="n">${s.chg}</td><td class="n">${s.same}</td></tr>`).join('')}</tbody></table></div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm pri" data-nkact="impgo">Загрузить ${imp.rows.length} записей</button><button class="btn sm" data-nkact="impno">Отмена</button><span class="mut">${H(imp.name)}</span></div>`:
      `<label class="btn sm">Выбрать файл резервной копии<input type="file" accept=".json,application/json" hidden data-nkch="impfile"></label><p class="note" style="margin:8px 0 0">Выписки из банка и 1С загружаются как обычно, в разделе «Операции» → «Загрузить выписку».</p>`}</section>`:''}`}
async function uploadFiles(list){if(!list||!list.length)return;if(NKB.levels.files!=='write')return say('Нет прав на загрузку файлов');
  const folder=((document.getElementById('nk-fold')||{}).value||'Общие').trim()||'Общие';const L=[...list];NKS.up={n:L.length,done:0};schedule();let ok=0;
  for(const f of L){try{if(f.size>50*1048576)throw new Error(`«${f.name}» больше 50 МБ`);const path='u/'+NKB.uuid()+NKB.ext(f.name);
      const up=await sb().storage.from('files').upload(path,f,{contentType:f.type||undefined});if(up.error)throw up.error;
      const ins=await sb().from('files').insert({name:f.name,folder,path,size:f.size,mime:f.type||null});if(ins.error){await sb().storage.from('files').remove([path]);throw ins.error}ok++}
    catch(e){say(errText(e))}NKS.up.done++;schedule()}
  NKS.up=null;NKS.fFolder=folder;if(ok)say(ok===1?'Файл загружен':`Загружено файлов: ${ok}`);loadFiles()}
ACT.fup=el=>{uploadFiles(el.files);el.value=''};
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#nk-drop');if(d){e.preventDefault();d.classList.add('on')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#nk-drop');if(d)d.classList.remove('on')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#nk-drop');if(!d)return;e.preventDefault();d.classList.remove('on');uploadFiles(e.dataTransfer.files)});
const fById=id=>(NKS.files||[]).find(x=>x.id===id);
ACT.fdl=async b=>{const x=fById(b.dataset.id);if(!x)return;const {data,error}=await sb().storage.from('files').download(x.path);if(error)throw error;NKB.saveBlob(x.name,data);NKB.log('download',x.name,{folder:x.folder,size:x.size},'files')};
ACT.fopen=async b=>{const x=fById(b.dataset.id);if(!x)return;const w=window.open('','_blank');const {data,error}=await sb().storage.from('files').createSignedUrl(x.path,300);
  if(error){if(w)w.close();throw error}if(w)w.location=data.signedUrl;else location.href=data.signedUrl;NKB.log('file_open',x.name,{folder:x.folder},'files')};
ACT.fdel=async b=>{if(!twice('fd'+b.dataset.id,b,'В корзину?'))return;const {error}=await sb().from('files').update({deleted:true,deleted_by:NKB.me.id,deleted_at:new Date().toISOString()}).eq('id',b.dataset.id);if(error)throw error;say('Файл в корзине');loadFiles()};
ACT.frestore=async b=>{const {error}=await sb().from('files').update({deleted:false,deleted_by:null,deleted_at:null}).eq('id',b.dataset.id);if(error)throw error;say('Файл возвращён');loadFiles()};
ACT.fpurge=async b=>{const x=fById(b.dataset.id);if(!x||!twice('fp'+x.id,b,'Удалить без возврата?'))return;const r=await sb().storage.from('files').remove([x.path]);if(r.error)throw r.error;const d=await sb().from('files').delete().eq('id',x.id);if(d.error)throw d.error;say('Файл удалён навсегда');loadFiles()};
ACT.fmove=async el=>{const {error}=await sb().from('files').update({folder:el.value}).eq('id',el.dataset.id);if(error)throw error;say('Перенесено в «'+el.value+'»');loadFiles()};
ACT.ffold=b=>{NKS.fFolder=b.dataset.id;schedule()};ACT.fq=el=>{NKS.fq=el.value;schedule()};ACT.ftrash=()=>{NKS.trash=!NKS.trash;schedule()};

function readable(){const out={};for(const [c,o] of Object.entries(NKB.cache))if(NKB.canRead(c)&&o&&Object.keys(o).length)out[c]=o;return out}
ACT.expjson=()=>{const docs=readable();const n=Object.values(docs).reduce((a,o)=>a+Object.keys(o).length,0);
  const body=JSON.stringify({system:'NEURO KIDS',format:1,exported_at:new Date().toISOString(),by:NKB.me.email,docs},null,1);
  NKB.saveBlob(`NEURO KIDS резервная копия ${TODAY}.json`,new Blob([body],{type:'application/json'}));NKB.log('export',`Резервная копия JSON · ${n} записей`,{counts:Object.fromEntries(Object.entries(docs).map(([c,o])=>[c,Object.keys(o).length]))})};
ACT.expxls=async()=>{const X=await loadXlsx();const wb=X.utils.book_new();const C=NKB.cache;let sheets=0;
  const add=(name,rows,cols)=>{if(!rows.length)return;const ws=X.utils.json_to_sheet(rows);if(cols)ws['!cols']=cols.map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,name);sheets++};
  const cat=id=>((C.cats||{})[id]||{}).name||id||'';const acc=id=>((C.accounts||{})[id]||{}).name||id||'';
  if(NKB.canRead('imports')){const R=[];for(const im of Object.values(C.imports||{}))for(const r of im.rows||[]){if(r.del)continue;const dir=((C.cats||{})[r.cat]||{}).dir;
      R.push({'Дата':r.date,'Счёт':acc(im.account),'Приход':dir==='in'?r.amount:null,'Расход':dir==='in'?null:r.amount,'Статья':cat(r.cat),'Контрагент':r.cp||'','Назначение':r.note||'','Файл':im.file||''})}
    R.sort((a,b)=>String(a['Дата']).localeCompare(String(b['Дата'])));add('Операции',R,[11,22,15,15,28,34,60,30]);
    add('Статьи ДДС',Object.entries(C.cats||{}).map(([id,c])=>({'Код':id,'Статья':c.name,'Направление':c.dir==='in'?'приход':c.dir==='out'?'расход':c.dir,'Группа':c.group})),[18,40,12,10])}
  if(NKB.canRead('staff'))add('Сотрудники',Object.values(C.staff||{}).map(s=>({'ФИО':s.name||'','Должность':s.pos||'','Статус':{work:'работает',left:'уволен',hire:'вакансия'}[s.status]||s.status,'Оклад':s.salary,'С':s.from||'','По':s.to||'','Тип':s.kind==='ovh'?'накладные':'специалист','Часы':s.hours||''})),[32,36,12,14,12,12,12,8]);
  if(NKB.canRead('services'))add('Услуги',Object.values(C.services||{}).map(v=>({'Услуга':v.name,'Цена':v.price,'Длительность, мин':v.dur,'План в месяц':v.plan??''})),[44,14,16,14]);
  if(NKB.canRead('citems'))add('Затраты',Object.values(C.citems||{}).map(v=>({'Статья':v.name,'Сумма в месяц':v.amount,'Услуга':((C.services||{})[v.svc]||{}).name||'накладные'})),[40,16,30]);
  if(!sheets)return say('Нет данных для выгрузки');const out=X.write(wb,{type:'array',bookType:'xlsx'});
  NKB.saveBlob(`NEURO KIDS данные ${TODAY}.xlsx`,new Blob([out]));NKB.log('export','Данные в Excel · листов: '+sheets)};
ACT.impfile=async el=>{const f=el.files&&el.files[0];el.value='';if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(e){return say('Это не файл резервной копии (JSON не читается)')}
  const docs=j&&j.docs;if(!docs||typeof docs!=='object')return say('В файле нет раздела docs — это не резервная копия системы');
  const stat={},rows=[];for(const [c,o] of Object.entries(docs)){if(!/^[a-z_]{2,30}$/.test(c)||!o||typeof o!=='object')continue;const s=stat[c]={add:0,chg:0,same:0};
    for(const [id,d] of Object.entries(o)){if(!d||typeof d!=='object')continue;const cur=(NKB.cache[c]||{})[id];if(cur===undefined)s.add++;else if(JSON.stringify(cur)===JSON.stringify(d)){s.same++;continue}else s.chg++;rows.push({collection:c,doc_id:String(id),data:d})}}
  NKS.imp={name:f.name,stat,rows};schedule()};
ACT.impno=()=>{NKS.imp=null;schedule()};
ACT.impgo=async b=>{const imp=NKS.imp;if(!imp)return;if(!imp.rows.length){NKS.imp=null;schedule();return say('Всё уже совпадает — загружать нечего')}
  b.disabled=true;let done=0;try{for(let i=0;i<imp.rows.length;i+=100){const part=imp.rows.slice(i,i+100);const {error}=await sb().from('docs').upsert(part,{onConflict:'collection,doc_id'});if(error)throw error;done+=part.length;b.textContent=`Загружено ${done} из ${imp.rows.length}…`}}
  catch(e){say(errText(e)+(done?` · успели загрузить ${done}`:''))}
  NKB.log('import',`Импорт из «${imp.name}»: ${done} записей`,{counts:Object.fromEntries(Object.entries(imp.stat).map(([c,s])=>[c,s.add+s.chg]))});
  NKS.imp=null;await NKB.loadAll();NKB.notifyAll();say(`Импорт завершён: ${done} записей`);schedule()};
})();

</script>
